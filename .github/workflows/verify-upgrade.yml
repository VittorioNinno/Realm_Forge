name: verify-upgrade
on:
  push:
    branches: [ 'ci/verify-species-upgrade', 'fix/species-sync-new-rows' ]
jobs:
  upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rf
        ports: [ "5432:5432" ]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=rf;Username=postgres
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Seed with the code before PR 7, then start the current code
        shell: bash
        run: |
          set -e
          q() { psql -h localhost -U postgres -d rf -tAc "$1"; }
          start() { dotnet run --project RealmForge/RealmForge.Api --no-launch-profile > "$1" 2>&1 & for i in $(seq 1 90); do curl -sf http://localhost:5080/api/feats >/dev/null && break; sleep 2; done; }
          git checkout -q 92d7dbe
          start old.log
          echo "::notice title=upgrade::OLD code: SRD traits=$(q 'SELECT count(*) FROM "Traits" WHERE "IsOfficialSRD"') v5=$(q "SELECT count(*) FROM \"Traits\" WHERE \"IsOfficialSRD\" AND substring(\"Id\"::text,15,1)='5'")"
          pkill -f RealmForge.Api; sleep 3
          git checkout -q ${{ github.sha }}
          start new.log
          echo "::notice title=upgrade::NEW code: SRD traits=$(q 'SELECT count(*) FROM "Traits" WHERE "IsOfficialSRD"') v5=$(q "SELECT count(*) FROM \"Traits\" WHERE \"IsOfficialSRD\" AND substring(\"Id\"::text,15,1)='5'") orphans=$(q 'SELECT count(*) FROM "Traits" WHERE "SpeciesId" IS NULL AND "SubspeciesId" IS NULL')"
          grep -iE "Concurrency failure|seeding (completed|failed)" new.log | head -15 | sed 's/^/::notice title=upgrade-log::/' || true
