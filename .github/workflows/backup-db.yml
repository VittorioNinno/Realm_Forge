name: backup-db

# Weekly encrypted dump of the production database, kept 90 days as a workflow artifact.
# The repository is public and its artifacts can be downloaded by any GitHub user,
# so the dump (accounts, Homebrew) is always encrypted before upload.
# Repository secrets:
#   BACKUP_DATABASE_URL  Neon connection string (postgresql://...?sslmode=require)
#   BACKUP_PASSPHRASE    long random passphrase: without it the backups cannot be opened, keep a copy elsewhere
# Restore: see .github/scripts/backup-db.sh
on:
  schedule:
    - cron: '23 3 * * 0'   # Sundays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check configuration
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$URL" ] || missing="$missing BACKUP_DATABASE_URL"
          [ -n "$PASS" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error title=backup-db::Missing repository secrets:$missing (see the comment at the top of backup-db.yml)"
            exit 1
          fi
          if [ ${#PASS} -lt 20 ]; then
            echo "::error title=backup-db::BACKUP_PASSPHRASE is too short (at least 20 characters)"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: .github/scripts/backup-db.sh backup

      - uses: actions/upload-artifact@v5
        with:
          name: realmforge-db-${{ github.run_number }}
          path: backup/*.dump.gpg
          retention-days: 90
          if-no-files-found: error
