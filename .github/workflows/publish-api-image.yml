name: publish-api-image

# Publishes the API container image to GitHub Container Registry at every release, for the self-hosted server
# (deploy/steam-machine): ghcr.io/<owner>/realmforge-api:release (followed by podman-auto-update) and :<commit>.
# The package must be public (Packages -> realmforge-api -> Package settings -> Change visibility), or the server
# must log in to ghcr.io with a token that can read packages.
on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Image name (lower case, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/realmforge-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: RealmForge/RealmForge.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:release
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
