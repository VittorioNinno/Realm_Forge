          cp=$(curl -s -X POST "$api/api/campaigns?lang=2" $json -H "Authorization: Bearer $B" -d '{"name":"Tavola di prova","ruleset":2}')
          echo "::notice title=characters::campaign create: $(printf '%s' "$cp" | tr '\n' ' ' | head -c 900)"
          cp_id=$(echo "$cp" | jq -r .id)
          cp_created=$(echo "$cp" | jq -c '{role: .myRole, members: (.members | length), link: (.inviteCode != null)}')
          cp_other=$(code "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $A")
          cp_invite=$(code -X POST "$api/api/campaigns/$cp_id/invites" $json -H "Authorization: Bearer $B" -d '{"email":"alice@example.com","role":3}')
          cp_inv_id=$(get "$api/api/campaigns/invitations" -H "Authorization: Bearer $A" | jq -r '.[0].id')
          cp_accept=$(code -X POST "$api/api/campaigns/invitations/$cp_inv_id/accept" -H "Authorization: Bearer $A")
          cp_player_invite=$(code -X POST "$api/api/campaigns/$cp_id/invites" $json -H "Authorization: Bearer $A" -d '{"email":"carol@example.com","role":2}')
