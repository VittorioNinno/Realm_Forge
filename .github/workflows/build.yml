          enc_saved=$(curl -s -X PUT "$api/api/campaigns/$cp_id/encounters/$enc_id" $json -H "Authorization: Bearer $B" -d "$enc_run" | jq -c '{status, version, round}')
          enc_stale=$(code -X PUT "$api/api/campaigns/$cp_id/encounters/$enc_id" $json -H "Authorization: Bearer $B" -d "$enc_run")
          enc_player_list2=$(get "$api/api/campaigns/$cp_id/encounters" -H "Authorization: Bearer $A" | jq -c '[.[] | {status, monsters, monsterXp}]')
          enc_player=$(get "$api/api/campaigns/$cp_id/encounters/$enc_id" -H "Authorization: Bearer $A" | jq -c '{notes, canManage, names: [.combatants[].name], goblin: (.combatants[] | select(.kind == 1) | {hp, armorClass, health, monsterId}), hero: (.combatants[] | select(.kind == 2) | .hp)}')
          enc_player_put=$(code -X PUT "$api/api/campaigns/$cp_id/encounters/$enc_id" $json -H "Authorization: Bearer $A" -d "$enc_run")
          enc_anon=$(code "$api/api/campaigns/$cp_id/encounters")
          # Encounter and sheet: the hero shows its sheet (5 of 19, prone); the master deals 3 damage, gives 4 temporary
          # hit points and swaps prone for poisoned, and the sheet changes; an older copy of the sheet saved by the player
          # gets the encounter's values back, a newer one is kept, and a later hit counts from it
          enc_master=$(get "$api/api/campaigns/$cp_id/encounters/$enc_id" -H "Authorization: Bearer $B")
          enc_hero=$(echo "$enc_master" | jq -c '.combatants[] | select(.kind == 2) | {hp, maxHp, tempHp, conditions, sheetHp}')
          enc_hit=$(echo "$enc_master" | jq -c '{name, notes, status, round, currentId, shown, partyIds, version, combatants: [.combatants[] | if .kind == 2 then .hp -= 3 | .tempHp = 4 | .conditions = ["poisoned"] else . end]}')
          enc_hit_saved=$(curl -s -X PUT "$api/api/campaigns/$cp_id/encounters/$enc_id" $json -H "Authorization: Bearer $B" -d "$enc_hit")
          enc_sheet_after=$(get "$api/api/characters/$ch_id" -H "Authorization: Bearer $A" | jq -c '{hp: .sheet.currentHitPoints, temp: .sheet.temporaryHitPoints, conditions: .sheet.conditions, stamp: .sheet.vitalsStamp}')
          enc_old_sheet=$(curl -s -X PUT "$api/api/characters/$ch_id/sheet" $json -H "Authorization: Bearer $A" -d "$(echo "$sheet" | jq -c '.currentHitPoints = 10 | .vitalsStamp = 0')" | jq -c '{hp: .vitals.currentHitPoints, conditions: .vitals.conditions}')
          enc_new_sheet=$(curl -s -X PUT "$api/api/characters/$ch_id/sheet" $json -H "Authorization: Bearer $A" -d "$(echo "$sheet" | jq -c '.currentHitPoints = 7 | .temporaryHitPoints = 4 | .conditions = ["poisoned"] | .vitalsStamp = 1')" | jq -c '.vitals')
          enc_hit2=$(echo "$enc_hit_saved" | jq -c '{name, notes, status, round, currentId, shown, partyIds, version, combatants: [.combatants[] | if .kind == 2 then .hp -= 1 else . end]}')
          enc_hit2_saved=$(curl -s -X PUT "$api/api/campaigns/$cp_id/encounters/$enc_id" $json -H "Authorization: Bearer $B" -d "$enc_hit2" | jq -c '.combatants[] | select(.kind == 2) | {hp, tempHp}')
          enc_vitals=$(get "$api/api/characters/$ch_id/vitals" -H "Authorization: Bearer $A" | jq -c '{stamp: .vitalsStamp, hp: .currentHitPoints, by: .updatedBy}')
          echo "::notice title=characters::encounter and sheet: hero=$enc_hero | after the hit=$enc_sheet_after | old sheet=$enc_old_sheet new sheet=$enc_new_sheet | second hit=$enc_hit2_saved vitals=$enc_vitals"
          echo "::notice title=characters::encounters: created=$enc_created player list=$enc_player_list GET=$enc_player_get POST=$enc_player_post | run=$enc_saved stale=$enc_stale | player list=$enc_player_list2 view=$enc_player PUT=$enc_player_put | anonymous=$enc_anon"
          # Requirements: a 2014 campaign refuses the 2024 character and says why
          cp14=$(curl -s -X POST "$api/api/campaigns?lang=2" $json -H "Authorization: Bearer $A" -d '{"name":"Tavola 2014","ruleset":1}' | jq -r .id)
          cp14_check=$(get "$api/api/campaigns/$cp14/characters/$ch_id/check?lang=2" -H "Authorization: Bearer $A" | jq -c '{ok, issues: [.issues[].issue]}')
          cp14_bring=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/api/campaigns/$cp14/characters" $json -H "Authorization: Bearer $A" -d "{\"characterId\":\"$ch_id\"}")
          code -X DELETE "$api/api/campaigns/$cp14" -H "Authorization: Bearer $A" >/dev/null
          # Notes: private (the author only), for the masters, the shared journal
          note() { curl -s -o /dev/null -w '%{http_code}' -X POST "$api/api/campaigns/$cp_id/notes" $json -H "Authorization: Bearer $1" -d "{\"kind\":$2,\"title\":\"$3\",\"body\":\"x\"}"; }
          cp_notes_post="$(note "$A" 1 Mia) $(note "$A" 3 Diario) $(note "$B" 2 Master) $(note "$A" 2 Vietata)"
          cp_notes_alice=$(get "$api/api/campaigns/$cp_id/notes" -H "Authorization: Bearer $A" | jq -c '[.[].kind] | sort')
          cp_notes_bob=$(get "$api/api/campaigns/$cp_id/notes" -H "Authorization: Bearer $B" | jq -c '[.[].kind] | sort')
          journal=$(get "$api/api/campaigns/$cp_id/notes" -H "Authorization: Bearer $B" | jq -r '.[] | select(.kind == 3) | .id')
          cp_note_edit_other=$(code -X PUT "$api/api/campaigns/$cp_id/notes/$journal" $json -H "Authorization: Bearer $B" -d '{"kind":3,"title":"x","body":"y"}')
          cp_note_delete=$(code -X DELETE "$api/api/campaigns/$cp_id/notes/$journal" -H "Authorization: Bearer $B")
          cp_promote=$(code -X PUT "$api/api/campaigns/$cp_id/members/$(get "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $B" | jq -r '.members[] | select(.name == "Alice") | .userId')" $json -H "Authorization: Bearer $B" -d '{"role":2}')
          bob_id=$(get "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $B" | jq -r '.members[] | select(.name == "Bob") | .userId')
          cp_comaster_promote=$(code -X PUT "$api/api/campaigns/$cp_id/members/$bob_id" $json -H "Authorization: Bearer $A" -d '{"role":3}')
          cp_last_master=$(code -X DELETE "$api/api/campaigns/$cp_id/members/me" -H "Authorization: Bearer $B")
          cp_bob_feat=$(curl -sf -X POST "$api/api/feats?lang=2" $json -H "Authorization: Bearer $B" -d "$feat" | jq -r .id)
          cp_master_share=$(curl -s -X POST "$api/api/campaigns/$cp_id/contents" $json -H "Authorization: Bearer $B" -d "{\"entityId\":\"$cp_bob_feat\"}")
          cp_comaster_remove_master=$(code -X DELETE "$api/api/campaigns/$cp_id/contents/$cp_bob_feat" -H "Authorization: Bearer $A")
          cp_contents=$(get "$api/api/campaigns/$cp_id?lang=2" -H "Authorization: Bearer $A" | jq -c '[.contents[] | {kind, status, removable: .canRemove}] | sort_by(.removable)')
          cp_shared_read=$(code "$api/api/feats/$cp_bob_feat" -H "Authorization: Bearer $A")
          cp_leave=$(code -X DELETE "$api/api/campaigns/$cp_id/members/me" -H "Authorization: Bearer $A")
          cp_after_leave=$(code "$api/api/characters/$ch_id" -H "Authorization: Bearer $B")
          cp_after_read=$(code "$api/api/feats/$cp_bob_feat" -H "Authorization: Bearer $A")
          cp_delete_other=$(code -X DELETE "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $A")
          cp_delete=$(code -X DELETE "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $B")
          code -X DELETE "$api/api/feats/$cp_feat" -H "Authorization: Bearer $A" >/dev/null; code -X DELETE "$api/api/feats/$cp_bob_feat" -H "Authorization: Bearer $B" >/dev/null
          echo "::notice title=characters::campaigns: created=$cp_created other=$cp_other | invite=$cp_invite accept=$cp_accept player invites co-master=$cp_player_invite | bring=$cp_bring | master GET=$cp_master_get context=$cp_master_ctx sheet=$cp_master_sheet owner sees=$cp_owner_view master DELETE=$cp_master_delete"
          echo "::notice title=characters::campaign content: share=$cp_share list=$cp_pending master reads pending=$cp_review_read | player approves=$cp_approve_player master=$cp_approve | promote=$cp_promote co-master promotes=$cp_comaster_promote last master leaves=$cp_last_master | master share=$cp_master_share co-master removes it=$cp_comaster_remove_master contents=$cp_contents read=$cp_shared_read | leave=$cp_leave master GET after=$cp_after_leave read after=$cp_after_read | delete other=$cp_delete_other delete=$cp_delete"
          ch_bob_delete=$(code -X DELETE "$api/api/characters/$ch_id" -H "Authorization: Bearer $B")
          ch_delete=$(code -X DELETE "$api/api/characters/$ch_id" -H "Authorization: Bearer $A")
          echo "::notice title=characters::context=$ctx_counts | 2014 fighter rows IT=$ctx_it | anonymous=$ch_anon | created=$ch_vitals | list=$ch_list | bob list=$ch_bob_list GET=$ch_bob sheet=$ch_bob_sheet DELETE=$ch_bob_delete"
          echo "::notice title=characters::refused: scores=$ch_bad_scores bonus=$ch_bad_bonus cantrips=$ch_bad_cantrips level-2 spell=$ch_bad_level2 skills=$ch_bad_skills kit=$ch_bad_kit language=$ch_bad_language multiclass=$ch_bad_multiclass edition=$ch_edition | level up=$ch_level2 | sheet=$ch_sheet saved=$ch_saved | list=$ch_list2 | DELETE=$ch_delete"

          chfail=0
          chcheck() { if [ "$2" != "$3" ]; then echo "::error title=characters::$1: got '$2', expected '$3'"; chfail=1; fi; }
          chcheck "2014 fighter rows (letters from the English text)" "$ctx_it" "ab ab ab ab"
          chcheck "anonymous list" "$ch_anon" "401"
          chcheck "derived values" "$ch_vitals" '{"hp":9,"ac":12,"items":true,"gold":13,"worn":2}'
          chcheck "owner list" "$ch_list" '[{"level":1,"classLine":"Mago","hp":9}]'
          chcheck "other list" "$ch_bob_list" "0"
          chcheck "other GET" "$ch_bob" "404"
          chcheck "scores not of the array" "$ch_bad_scores" "400"
          chcheck "+1 to all in 2024" "$ch_bad_bonus" "400"
          chcheck "one cantrip too many" "$ch_bad_cantrips" "400"
          chcheck "level 2 spell at level 1" "$ch_bad_level2" "400"
          chcheck "repeated skill" "$ch_bad_skills" "400"
          chcheck "unknown kit" "$ch_bad_kit" "400"
          chcheck "secret language" "$ch_bad_language" "400"
          chcheck "multiclass without Strength 13" "$ch_bad_multiclass" "400"
          chcheck "level up into fighter" "$ch_level2" '{"hp":19,"levels":2,"items":true}'
          chcheck "spell keys in the context" "$ctx_spell_keys" '{"keyed":true,"bless":1}'
          chcheck "sheet saved" "$ch_sheet" '{"hp":19,"ac":12}'
          chcheck "sheet read back" "$ch_saved" '{"hp":5,"conditions":["prone"],"gp":99,"notes":"Test"}'
          chcheck "other sheet PUT" "$ch_bob_sheet" "404"
          chcheck "edition change" "$ch_edition" "400"
          chcheck "list after level up" "$ch_list2" '[{"level":2,"classLine":"Mago 1 / Guerriero 1","hp":5}]'
          chcheck "other DELETE" "$ch_bob_delete" "404"
          chcheck "share with bob" "$sh_add" "bob@example.com"
          chcheck "share with an unknown address" "$sh_unknown" "404"
          chcheck "shared GET" "$sh_get" '{"readOnly":true,"name":"Elminster di prova"}'
          chcheck "owner GET" "$sh_owner_get" "false"
          chcheck "shared list" "$sh_list" '[{"name":"Elminster di prova","owner":"Alice"}]'
          chcheck "shared context" "$sh_ctx" "200"
          chcheck "shared sheet PUT" "$sh_sheet" "404"
          chcheck "people" "$sh_people" "bob@example.com"
          chcheck "leave" "$sh_leave" "204"
          chcheck "campaign created" "$cp_created" '{"role":1,"members":1,"link":true}'
          chcheck "campaign of others" "$cp_other" "404"
          chcheck "invite" "$cp_invite" "200"
          chcheck "accept" "$cp_accept" "204"
          chcheck "player invites a co-master" "$cp_player_invite" "403"
          chcheck "bring a character" "$cp_bring" "204"
          chcheck "master opens it" "$cp_master_get" '{"readOnly":false,"isOwner":false,"ownerName":"Alice","campaigns":1}'
          chcheck "master context" "$cp_master_ctx" "200"
          chcheck "master saves the sheet" "$cp_master_sheet" "200"
          chcheck "owner sees the change" "$cp_owner_view" '{"notes":"Il master","lastEditedBy":"Bob"}'
          chcheck "master cannot delete it" "$cp_master_delete" "404"
          chcheck "player share waits" "$cp_share" "1"
          chcheck "campaign list" "$cp_pending" '[{"role":1,"members":2,"characters":1,"pending":1}]'
          chcheck "master reads the pending entry" "$cp_review_read" "200"
          chcheck "player approves" "$cp_approve_player" "403"
          chcheck "master approves" "$cp_approve" "204"
          chcheck "encounter created" "$enc_created" '{"status":1,"version":1,"combatants":3,"party":1,"conditions":["prone"],"canManage":true}'
          chcheck "planned encounters are hidden from players" "$enc_player_list" "0"
          chcheck "player GET of a planned encounter" "$enc_player_get" "404"
          chcheck "player creates an encounter" "$enc_player_post" "403"
          chcheck "encounter under way" "$enc_saved" '{"status":2,"version":2,"round":1}'
          chcheck "stale save" "$enc_stale" "409"
          chcheck "player list" "$enc_player_list2" '[{"status":2,"monsters":1,"monsterXp":0}]'
          chcheck "player view" "$enc_player" '{"notes":"","canManage":false,"names":["Goblin 1","Eroe"],"goblin":{"hp":0,"armorClass":0,"health":3,"monsterId":null},"hero":5}'
          chcheck "player PUT" "$enc_player_put" "403"
          chcheck "anonymous encounters" "$enc_anon" "401"
          chcheck "hero from the sheet" "$enc_hero" '{"hp":5,"maxHp":19,"tempHp":0,"conditions":["prone"],"sheetHp":5}'
          chcheck "the hit on the sheet" "$enc_sheet_after" '{"hp":2,"temp":4,"conditions":["poisoned"],"stamp":1}'
          chcheck "old sheet copy" "$enc_old_sheet" '{"hp":2,"conditions":["poisoned"]}'
          chcheck "new sheet copy" "$enc_new_sheet" "null"
          chcheck "second hit from the sheet" "$enc_hit2_saved" '{"hp":6,"tempHp":4}'
          chcheck "vitals" "$enc_vitals" '{"stamp":2,"hp":6,"by":"Bob"}'
          chcheck "2014 campaign check" "$cp14_check" '{"ok":false,"issues":[1]}'
