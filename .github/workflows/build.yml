          goblin=$(get "$api/api/monsters?ruleset=1&lang=2" | jq -r '.[] | select(.name == "Goblin") | .id')
          enc=$(curl -s -X POST "$api/api/campaigns/$cp_id/encounters" $json -H "Authorization: Bearer $B" -d "{\"name\":\"Imboscata\",\"combatants\":[{\"kind\":1,\"monsterId\":\"$goblin\",\"name\":\"Goblin 1\",\"armorClass\":15,\"maxHp\":7,\"hp\":3,\"xp\":50,\"initiative\":12},{\"kind\":1,\"monsterId\":\"$goblin\",\"name\":\"Goblin 2\",\"armorClass\":15,\"maxHp\":7,\"hp\":7,\"xp\":50,\"hidden\":true,\"conditions\":[\"prone\",\"flying\"]},{\"kind\":2,\"characterId\":\"$ch_id\",\"name\":\"Eroe\",\"maxHp\":9,\"hp\":9,\"initiative\":15}]}")
          echo "::notice title=characters::encounter create: $(printf '%s' "$enc" | tr '\n' ' ' | head -c 600)"
