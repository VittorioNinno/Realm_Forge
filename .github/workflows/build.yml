          enc_created=$(echo "$enc" | jq -c '{status, version, combatants: (.combatants | length), party: (.partyIds | length), conditions: .combatants[1].conditions, canManage}')
          enc_player_list=$(get "$api/api/campaigns/$cp_id/encounters" -H "Authorization: Bearer $A" | jq length)
          enc_player_get=$(code "$api/api/campaigns/$cp_id/encounters/$enc_id" -H "Authorization: Bearer $A")
