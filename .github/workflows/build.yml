          cp_owner_view=$(get "$api/api/characters/$ch_id" -H "Authorization: Bearer $A" | jq -c '{notes: .sheet.notes, lastEditedBy}')
          cp_master_delete=$(code -X DELETE "$api/api/characters/$ch_id" -H "Authorization: Bearer $B")
          cp_feat=$(curl -sf -X POST "$api/api/feats?lang=2" $json -H "Authorization: Bearer $A" -d "$feat" | jq -r .id)
          cp_share=$(curl -s -X POST "$api/api/campaigns/$cp_id/contents" $json -H "Authorization: Bearer $A" -d "{\"entityId\":\"$cp_feat\"}")
          cp_pending=$(get "$api/api/campaigns" -H "Authorization: Bearer $B" | jq -c '[.[] | {role: .myRole, members, characters, pending: .pendingContents}]')
          cp_review_read=$(code "$api/api/feats/$cp_feat" -H "Authorization: Bearer $B")
          cp_approve_player=$(code -X POST "$api/api/campaigns/$cp_id/contents/$cp_feat/approve" -H "Authorization: Bearer $A")
          cp_approve=$(code -X POST "$api/api/campaigns/$cp_id/contents/$cp_feat/approve" -H "Authorization: Bearer $B")
          # Encounters: the master prepares one (a goblin, a hidden goblin, alice's character); the player sees it only once it
