          chcheck "notes of the player" "$cp_notes_alice" "[1,3]"
          chcheck "notes of the master" "$cp_notes_bob" "[2,3]"
          chcheck "edit someone else's note" "$cp_note_edit_other" "403"
          chcheck "master deletes a journal page" "$cp_note_delete" "204"
          chcheck "promote to co-master" "$cp_promote" "204"
          chcheck "co-master promotes" "$cp_comaster_promote" "403"
          chcheck "last master leaves" "$cp_last_master" "400"
          chcheck "master share approved" "$cp_master_share" "2"
          chcheck "co-master removes the master's entry" "$cp_comaster_remove_master" "403"
          chcheck "contents for the co-master" "$cp_contents" '[{"kind":"feat","status":2,"removable":false},{"kind":"feat","status":2,"removable":true}]'
          chcheck "member reads shared content" "$cp_shared_read" "200"
          chcheck "leave the campaign" "$cp_leave" "204"
          chcheck "character left with its owner" "$cp_after_leave" "404"
          chcheck "content no longer shared" "$cp_after_read" "404"
          chcheck "others delete the campaign" "$cp_delete_other" "404"
          chcheck "master deletes the campaign" "$cp_delete" "204"
          chcheck "GET after leaving" "$sh_after" "404"
          chcheck "DELETE" "$ch_delete" "204"
          test "$chfail" = "0"

          # The bin: Alice's deleted character, Bob's deleted campaign (with its master) and a feat come back; nobody
          # restores someone else's entry, an entry restores once; then everything is deleted again and purged
          tr_entry() { get "$api/api/trash?lang=2" -H "Authorization: Bearer $1" | jq -r --arg id "$2" '.[] | select(.entityId == $id) | .id'; }
          tr_char_row=$(get "$api/api/trash?lang=2" -H "Authorization: Bearer $A" | jq -c --arg id "$ch_id" '[.[] | select(.entityId == $id) | {kind, name, days: (((.expiresAt | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) - (.deletedAt | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601)) / 86400 | round)}]')
          tr_char=$(tr_entry "$A" "$ch_id")
          tr_camp=$(tr_entry "$B" "$cp_id")
          tr_feat=$(tr_entry "$A" "$cp_feat")
          tr_other=$(code -X POST "$api/api/trash/$tr_camp/restore" -H "Authorization: Bearer $A")
          tr_char_restore=$(curl -s -X POST "$api/api/trash/$tr_char/restore?lang=2" -H "Authorization: Bearer $A" | jq -c --arg id "$ch_id" '{kind, link: (.link == ("characters/" + $id))}')
          tr_char_get=$(code "$api/api/characters/$ch_id" -H "Authorization: Bearer $A")
          tr_camp_restore=$(code -X POST "$api/api/trash/$tr_camp/restore?lang=2" -H "Authorization: Bearer $B")
          tr_camp_get=$(get "$api/api/campaigns/$cp_id?lang=2" -H "Authorization: Bearer $B" | jq -c '{characters: (.characters | length), members: (.members | length)}')
          tr_twice=$(code -X POST "$api/api/trash/$tr_camp/restore" -H "Authorization: Bearer $B")
          tr_feat_restore=$(code -X POST "$api/api/trash/$tr_feat/restore" -H "Authorization: Bearer $A")
          tr_feat_get=$(code "$api/api/feats/$cp_feat" -H "Authorization: Bearer $A")
          code -X DELETE "$api/api/campaigns/$cp_id" -H "Authorization: Bearer $B" >/dev/null
          code -X DELETE "$api/api/characters/$ch_id" -H "Authorization: Bearer $A" >/dev/null
          code -X DELETE "$api/api/feats/$cp_feat" -H "Authorization: Bearer $A" >/dev/null
          tr_purge=$(code -X DELETE "$api/api/trash/$(tr_entry "$A" "$ch_id")" -H "Authorization: Bearer $A")
          code -X DELETE "$api/api/trash/$(tr_entry "$A" "$cp_feat")" -H "Authorization: Bearer $A" >/dev/null
          code -X DELETE "$api/api/trash/$(tr_entry "$B" "$cp_id")" -H "Authorization: Bearer $B" >/dev/null
          tr_after=$(get "$api/api/trash?lang=2" -H "Authorization: Bearer $A" | jq --arg id "$ch_id" '[.[] | select(.entityId == $id)] | length')
          tr_anon=$(code "$api/api/trash")
          echo "::notice title=bin::character=$tr_char_row restore=$tr_char_restore GET=$tr_char_get | campaign restore=$tr_camp_restore detail=$tr_camp_get by another=$tr_other twice=$tr_twice | feat restore=$tr_feat_restore GET=$tr_feat_get | purge=$tr_purge after=$tr_after anonymous=$tr_anon"
          trfail=0
          trcheck() { if [ "$2" != "$3" ]; then echo "::error title=bin::$1: got '$2', expected '$3'"; trfail=1; fi; }
          trcheck "deleted character in the bin" "$tr_char_row" '[{"kind":"character","name":"Elminster di prova","days":3}]'
          trcheck "someone else's entry" "$tr_other" "404"
          trcheck "character restored" "$tr_char_restore" '{"kind":"character","link":true}'
          trcheck "character back" "$tr_char_get" "200"
          trcheck "campaign restored" "$tr_camp_restore" "200"
          trcheck "campaign back with its master" "$tr_camp_get" '{"characters":0,"members":1}'
          trcheck "restored once" "$tr_twice" "404"
          trcheck "feat restored" "$tr_feat_restore" "200"
          trcheck "feat back" "$tr_feat_get" "200"
          trcheck "purged" "$tr_purge" "204"
          trcheck "gone from the bin" "$tr_after" "0"
          trcheck "anonymous" "$tr_anon" "401"
          test "$trfail" = "0"

          # Account: change of e-mail (confirmed on the new address) and deletion of the account with its data;
          # private Homebrew goes, public Homebrew stays without an author, the campaign passes to the other member
          test "$(code -X POST $api/api/auth/register $json -d "$(cred dave@example.com)")" = "200"
          test "$(code -X POST $api/api/auth/register $json -d "$(cred erin@example.com)")" = "200"
          test "$(confirm dave@example.com)" = "200" && test "$(confirm erin@example.com)" = "200"
          D=$(curl -sf -X POST $api/api/auth/login $json -d "$(cred dave@example.com)" | jq -r .accessToken)
          E=$(curl -sf -X POST $api/api/auth/login $json -d "$(cred erin@example.com)" | jq -r .accessToken)
          ac_email=$(code -X POST $api/api/auth/manage/info $json -H "Authorization: Bearer $D" -d '{"newEmail":"dave2@example.com"}')
          sleep 1
          ac_confirm=$(confirm dave2@example.com)
          ac_info=$(curl -sf $api/api/auth/manage/info -H "Authorization: Bearer $D" | jq -r .email)
          ac_login_old=$(code -X POST $api/api/auth/login $json -d "$(cred dave@example.com)")
          D=$(curl -sf -X POST $api/api/auth/login $json -d "$(cred dave2@example.com)" | jq -r .accessToken)
          ac_private=$(curl -sf -X POST "$api/api/feats?lang=2" $json -H "Authorization: Bearer $D" -d "$feat" | jq -r .id)
          ac_public=$(curl -sf -X POST "$api/api/feats?lang=2" $json -H "Authorization: Bearer $D" -d "$(echo "$feat" | jq '.visibility = 0')" | jq -r .id)
          ac_cp=$(curl -sf -X POST "$api/api/campaigns?lang=2" $json -H "Authorization: Bearer $D" -d '{"name":"Tavola di Dave","ruleset":2}' | jq -r .id)
          code -X POST "$api/api/campaigns/$ac_cp/invites" $json -H "Authorization: Bearer $D" -d '{"email":"erin@example.com","role":3}' >/dev/null
          ac_inv=$(curl -sf "$api/api/campaigns/invitations" -H "Authorization: Bearer $E" | jq -r '.[0].id')
          code -X POST "$api/api/campaigns/invitations/$ac_inv/accept" -H "Authorization: Bearer $E" >/dev/null
          ac_solo=$(curl -sf -X POST "$api/api/campaigns?lang=2" $json -H "Authorization: Bearer $D" -d '{"name":"Solo","ruleset":2}' | jq -r .id)
          ac_wrong=$(code -X DELETE $api/api/account $json -H "Authorization: Bearer $D" -d '{"password":"wrong"}')
          ac_delete=$(curl -s -X DELETE $api/api/account $json -H "Authorization: Bearer $D" -d "$(jq -nc --arg p "$PW" '{password:$p}')" | jq -c .)
          ac_private_after=$(code "$api/api/feats/$ac_private")
          ac_public_after=$(curl -s "$api/api/feats/$ac_public" -H "Authorization: Bearer $E" | jq -c '{canEdit, visibility}')
          ac_cp_after=$(curl -s "$api/api/campaigns/$ac_cp?lang=2" -H "Authorization: Bearer $E" | jq -c '{role: .myRole, members: (.members | length)}')
          ac_solo_rows=$(psql -h localhost -U postgres -d realm_forge_ci -tAc "SELECT count(*) FROM \"Campaigns\" WHERE \"Id\" = '$ac_solo'" 2>/dev/null || echo "?")
          ac_login_after=$(code -X POST $api/api/auth/login $json -d "$(cred dave2@example.com)")
          ac_token_after=$(code $api/api/account/summary -H "Authorization: Bearer $D")
          echo "::notice title=account::change e-mail=$ac_email confirm=$ac_confirm now=$ac_info old login=$ac_login_old | delete wrong password=$ac_wrong ok=$ac_delete | private feat=$ac_private_after public feat=$ac_public_after | campaign for erin=$ac_cp_after solo rows=$ac_solo_rows | login after=$ac_login_after token after=$ac_token_after"
          acfail=0
          accheck() { if [ "$2" != "$3" ]; then echo "::error title=account::$1: got '$2', expected '$3'"; acfail=1; fi; }
          accheck "change e-mail" "$ac_email" "200"
          accheck "confirm new e-mail" "$ac_confirm" "200"
          accheck "new e-mail in use" "$ac_info" "dave2@example.com"
          accheck "old e-mail no longer signs in" "$ac_login_old" "401"
          accheck "wrong password" "$ac_wrong" "400"
          accheck "deleted" "$ac_delete" '{"characters":0,"homebrewDeleted":1,"homebrewKept":1,"campaignsDeleted":1,"campaignsHandedOver":1}'
          accheck "private Homebrew gone" "$ac_private_after" "404"
          accheck "public Homebrew kept, nobody edits it" "$ac_public_after" '{"canEdit":false,"visibility":0}'
          accheck "campaign handed over" "$ac_cp_after" '{"role":1,"members":1}'
          accheck "account gone" "$ac_login_after" "401"
          accheck "old token refused" "$ac_token_after" "401"
          accheck "empty campaign deleted" "$ac_solo_rows" "0"
          test "$acfail" = "0"

  ui:
    runs-on: ubuntu-24.04
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway CI database: no password at all (trust auth), so nothing secret is stored here
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: realm_forge_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build once
        # Building API and client with two concurrent "dotnet run" makes them race on the shared projects (flaky starts)
        run: dotnet build RealmForge/RealmForge.slnx --configuration Debug

      - name: Start API and client
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=realm_forge_ci;Username=postgres
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          # Point the client at the CI API (plain http)
          echo '{ "ApiBaseUrl": "http://localhost:5080/" }' > RealmForge/RealmForge.Client/wwwroot/appsettings.Development.json
          ASPNETCORE_URLS=http://localhost:5080 nohup dotnet run --no-build --project RealmForge/RealmForge.Api --no-launch-profile > api.log 2>&1 &
          nohup dotnet run --no-build --project RealmForge/RealmForge.Client --launch-profile http > client.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5080/api/feats >/dev/null && curl -sf http://localhost:5227 >/dev/null && exit 0
            sleep 3
          done
          # Startup failed: show why
          curl -sf http://localhost:5080/api/feats >/dev/null && echo "::error title=ui::API is up" || echo "::error title=ui::API did not start"
          curl -sf http://localhost:5227 >/dev/null && echo "::error title=ui::client is up" || echo "::error title=ui::client did not start"
          tail -n 15 api.log | sed 's/^/::error title=api-log::/'
          tail -n 15 client.log | sed 's/^/::error title=client-log::/'
          exit 1

      - name: Run UI smoke test
        working-directory: .github/ui-smoke
        run: |
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node smoke.mjs

      - name: Keep the screenshots of the smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: |
            .github/ui-smoke/shots/
            .github/ui-smoke/ui-failure.png
          retention-days: 7
          if-no-files-found: ignore

  # The API image as Render builds it: Production environment, PORT from the platform, a postgresql:// URL as on Neon,
  # migrations at startup, health check, data protection keys stored in the database, and a client publish.
  # The allowed origin is given with a trailing slash on purpose: it must still match the browser's Origin header
  container:
    runs-on: ubuntu-24.04
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: realm_forge_prod
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Build the API image
        run: docker build -f RealmForge/RealmForge.Api/Dockerfile -t realmforge-api .

      - name: Run it as on Render and check it
        shell: bash
        run: |
          set -e
          # Stand-in for the Brevo API: stores the request and answers 201 like the real service
          cat > /tmp/brevo.py <<'PY'
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers['Content-Length']))
                  with open('/tmp/brevo-request.json', 'w') as f:
                      json.dump({'path': self.path, 'apiKey': self.headers.get('api-key'), 'body': json.loads(body)}, f)
                  self.send_response(201); self.send_header('Content-Type', 'application/json'); self.end_headers()
                  self.wfile.write(b'{"messageId":"<ci@realmforge.example>"}')
          http.server.HTTPServer(('127.0.0.1', 18080), H).serve_forever()
          PY
          python3 /tmp/brevo.py &
          BREVO_KEY="xkeysib-$(openssl rand -hex 16)"
          start() {
            docker run -d --name api --network host \
              -e PORT=10000 \
              -e Email__BrevoApiKey="$BREVO_KEY" \
              -e Email__BrevoApiUrl=http://127.0.0.1:18080/v3/smtp/email \
              -e Email__FromAddress=noreply@realmforge.example \
              -e ConnectionStrings__DefaultConnection="postgresql://postgres@localhost:5432/realm_forge_prod?sslmode=disable" \
              -e Database__MigrateOnStartup=true \
              -e Cors__AllowedOrigins__0=https://realmforge.example/ \
              realmforge-api > /dev/null
            for i in $(seq 1 60); do
              if curl -sf http://localhost:10000/health > /dev/null; then return 0; fi
              sleep 2
            done
            docker logs api | tail -30 | sed 's/^/::error title=container::/'
            exit 1
          }
          start
          health=$(curl -s http://localhost:10000/health)
          feats=$(curl -sf "http://localhost:10000/api/feats?isOfficial=true" | jq length)
          scheme=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://localhost:10000/api/feats)
          cors=$(curl -s -D - -o /dev/null -H 'Origin: https://realmforge.example' http://localhost:10000/api/feats | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:"{print $2}')
          keys=$(psql -h localhost -U postgres -d realm_forge_prod -tAc 'SELECT count(*) FROM "DataProtectionKeys"')

          # A token issued before a restart must still work after it (keys survive in the database)
          PW="Rf-$(openssl rand -hex 12)A!"
          body=$(jq -nc --arg p "$PW" '{email:"prod@example.com",password:$p}')
          curl -sf -X POST http://localhost:10000/api/auth/register -H Content-Type:application/json -d "$body" > /dev/null
          # The confirmation e-mail went out through the (mock) Brevo API with the key, the recipient and the client link
          for i in $(seq 1 15); do [ -f /tmp/brevo-request.json ] && break; sleep 1; done
          brevo=$(jq -r --arg k "$BREVO_KEY" '[.path == "/v3/smtp/email", .apiKey == $k, .body.to[0].email == "prod@example.com",
            .body.sender.email == "noreply@realmforge.example", (.body.htmlContent | contains("https://realmforge.example/confirm-email?")),
            (.body.textContent | length > 0)] | all' /tmp/brevo-request.json 2>/dev/null || echo false)
          if [ "$brevo" != "true" ]; then
            echo "::warning title=brevo::request=$(jq -c '.body.htmlContent |= .[0:0] | .apiKey |= (. != null)' /tmp/brevo-request.json 2>&1 | head -c 600)"
            echo "::warning title=brevo::api log=$(docker logs api 2>&1 | grep -iE 'e-mail|brevo' | tr '\n' ' ' | head -c 900)"
          fi
          token=$(curl -sf -X POST http://localhost:10000/api/auth/login -H Content-Type:application/json -d "$body" | jq -r .accessToken)
          docker rm -f api > /dev/null
          start
          after_restart=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/auth/manage/info -H "Authorization: Bearer $token")
          scalar=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/scalar)
          # Sign-in attempts are limited per address: after 10 wrong passwords in a minute the API answers 429
          bad=$(jq -nc '{email:"prod@example.com",password:"wrong"}')
          limited=$(for i in $(seq 1 12); do curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:10000/api/auth/login -H Content-Type:application/json -d "$bad"; done | sort | uniq -c | awk '{printf "%s×%s ", $2, $1}')
          after_limit=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/feats)

          echo "::notice title=container::health=$health | base feats=$feats | forwarded https=$scheme | cors=$cors | data protection keys=$keys | token after restart=$after_restart | API reference in production=$scalar | e-mail via Brevo=$brevo | wrong sign-ins=$limited reads after=$after_limit"
          test "$health" = "Healthy" && test "$feats" = "117" && test "$scheme" = "200" && test "$cors" = "https://realmforge.example" \
            && test "$keys" -ge 1 && test "$after_restart" = "200" && test "$scalar" = "404" && test "$brevo" = "true" \
            && echo "$limited" | grep -q "401×10" && echo "$limited" | grep -q "429×2" && test "$after_limit" = "200"

      - name: Back up the database as backup-db does and restore it
        shell: bash
        run: |
          set -e
          PASS="$(openssl rand -hex 24)"
          DATABASE_URL="postgresql://postgres@localhost:5432/realm_forge_prod?sslmode=disable" BACKUP_PASSPHRASE="$PASS" \
            .github/scripts/backup-db.sh /tmp/backup
          file=$(ls /tmp/backup/*.dump.gpg)
          # Without the passphrase the file cannot be read
          wrong=$(printf 'wrong' | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "$file" > /dev/null 2>&1 && echo opened || echo refused)
          printf '%s' "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "$file" > /tmp/restore.dump
          psql -h localhost -U postgres -c 'CREATE DATABASE restore_check' > /dev/null
          docker run --rm -i --network host postgres:18 \
            pg_restore --no-owner --no-privileges -d "postgresql://postgres@localhost:5432/restore_check" < /tmp/restore.dump
          count() { psql -h localhost -U postgres -d "$1" -tAc "$2"; }
          q_users='SELECT count(*) FROM "AspNetUsers"'
          q_feats='SELECT count(*) FROM "Feats"'
          users=$(count restore_check "$q_users"); feats=$(count restore_check "$q_feats")
          echo "::notice title=backup::wrong passphrase=$wrong | restored users=$users (source $(count realm_forge_prod "$q_users")) | feats=$feats (source $(count realm_forge_prod "$q_feats"))"
          test "$wrong" = "refused" && test "$users" = "$(count realm_forge_prod "$q_users")" && test "$users" -ge 1 \
            && test "$feats" = "$(count realm_forge_prod "$q_feats")"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish the client as deploy-client does
        run: |
          .github/scripts/publish-client.sh https://realmforge-api.example publish
          test "$(jq -r .ApiBaseUrl publish/wwwroot/appsettings.json)" = "https://realmforge-api.example/"
          files=$(find publish/wwwroot -type f | wc -l)
          largest=$(find publish/wwwroot -type f -printf '%s\n' | sort -n | tail -1)
          echo "::notice title=container::client publish: $files files, largest $((largest / 1024)) KiB (Cloudflare Pages: max 20000 files, 25 MiB each)"
          test -f publish/wwwroot/index.html && test "$files" -lt 20000 && test "$largest" -lt 26214400
