name: build

on:
  push:
    branches: [ develop, release, 'fix/**', 'feat/**', 'refactor/**', 'chore/**' ]
  pull_request:
    branches: [ develop ]

# Runners pinned to Ubuntu 24.04: ubuntu-latest moves to Ubuntu 26 from 19 October 2026 (actions/runner-images#14748);
# move to the new image deliberately, in its own PR, once the jobs pass on it.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RealmForge/RealmForge.slnx

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build RealmForge/RealmForge.slnx --no-restore --configuration Release | tee build.log
          echo "::notice title=build::$(grep -oE 'warning [A-Z]+[0-9]+' build.log | sort | uniq -c | sort -rn | tr '\n' ';')"
          echo "::notice title=build::$(grep -oE 'different versions of "[^"]+"' build.log | sort | uniq -c | tr '\n' ';')"
          echo "::notice title=build::$(grep -oE 'warning CS[0-9]+: [^[]{0,120}' build.log | sort -u | head -20 | tr '\n' ';')"
          # NuGet audit: vulnerable packages (package, version, advisory link)
          if grep -qE 'warning NU190[1-4]' build.log; then
            grep -oE "warning NU190[1-4]: [^[]{0,220}" build.log | sort -u | head -10 | sed 's/^/::warning title=nuget-audit::/'
          fi

      # Informational: newer stable versions of the NuGet packages (never fails the build)
      - name: Outdated packages
        shell: bash
        run: |
          dotnet list RealmForge/RealmForge.slnx package --outdated --format json > outdated.json 2> /dev/null || true
          updates=$(jq -r '[.projects[].frameworks[]?.topLevelPackages[]? | "\(.id) \(.resolvedVersion) -> \(.latestVersion)"] | unique | join("; ")' outdated.json 2> /dev/null || true)
          echo "::notice title=outdated-packages::${updates:-all packages are up to date}"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test RealmForge/RealmForge.slnx --no-build --configuration Release | tee test.log
          grep -E "Passed!|Failed!|error" test.log | sed 's/^/::notice title=tests::/' || true

  database:
    runs-on: ubuntu-24.04
    needs: build
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway CI database: no password at all (trust auth), so nothing secret is stored here
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: realm_forge_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONN: Host=localhost;Port=5432;Database=realm_forge_ci;Username=postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and install dotnet-ef
        run: |
          dotnet restore RealmForge/RealmForge.slnx
          dotnet tool install --global dotnet-ef --version 10.0.13

      - name: Apply migrations up to AddFeatsTable and insert a legacy Homebrew feat
        shell: bash
        run: |
          set -e
          dotnet ef database update AddFeatsTable --project RealmForge/RealmForge.Infrastructure --startup-project RealmForge/RealmForge.Api --connection "$CONN"
          psql -h localhost -U postgres -d realm_forge_ci -v ON_ERROR_STOP=1 -c "
            INSERT INTO \"Feats\" (\"Id\",\"Category\",\"Prerequisite\",\"Ruleset\",\"IsOfficialSRD\",\"AuthorId\")
            VALUES ('aaaaaaaa-0000-0000-0000-000000000001', 2, 'Elf or Half-Elf', 2, false, NULL);
            INSERT INTO \"FeatTranslations\" (\"Id\",\"FeatId\",\"Language\",\"Name\",\"Description\")
            VALUES ('aaaaaaaa-0000-0000-0000-000000000002','aaaaaaaa-0000-0000-0000-000000000001',1,'Legacy','x'),
                   ('aaaaaaaa-0000-0000-0000-000000000003','aaaaaaaa-0000-0000-0000-000000000001',2,'Legacy IT','x');"

      - name: Apply remaining migrations and check the legacy prerequisite survived
        shell: bash
        run: |
          set -e
          dotnet ef database update --project RealmForge/RealmForge.Infrastructure --startup-project RealmForge/RealmForge.Api --connection "$CONN"
          notes=$(psql -h localhost -U postgres -d realm_forge_ci -tAc "SELECT count(*) FROM \"FeatTranslations\" WHERE \"PrerequisiteNote\" = 'Elf or Half-Elf'")
          echo "::notice title=database::legacy homebrew notes preserved: $notes/2"
          test "$notes" = "2"

      - name: Start the API and check seeding
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONN }}
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          set -e
          dotnet run --project RealmForge/RealmForge.Api --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/api/feats >/dev/null && break; sleep 2; done
          feats=$(curl -sf "http://localhost:5080/api/feats?isOfficial=true" | jq length)
          species=$(curl -sf "http://localhost:5080/api/species" | jq 'map(select(.isOfficialSRD)) | length')
          keen=$(curl -sf "http://localhost:5080/api/feats/11111111-2222-3333-4444-555555555571?lang=2" | jq -r .prerequisite)
          status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost:5080/api/feats/11111111-2222-3333-4444-555555555571")
          echo "::notice title=database::SRD feats=$feats species=$species | Keen Mind (IT) prerequisite='$keen' | anonymous DELETE SRD -> $status"
          grep -iE "fail|error" api.log | head -10 | sed 's/^/::warning title=api-log::/' || true
          test "$feats" = "117"
          test "$species" = "19"
          test "$keen" = "Livello 4+, Intelligenza 13+"
          test "$status" = "401"

      - name: Restart the API and check that existing SRD rows are re-synchronized
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONN }}
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          set -e
          pkill -f RealmForge.Api || true
          sleep 3
          # Simulate a database seeded by the old seeders: no structured prerequisites, outdated name
          psql -h localhost -U postgres -d realm_forge_ci -v ON_ERROR_STOP=1 -c "
            UPDATE \"Feats\" SET \"PrerequisiteMinimumLevel\" = NULL, \"PrerequisiteAbilities\" = '{}', \"PrerequisiteMinimumScore\" = NULL
            WHERE \"Id\" = '11111111-2222-3333-4444-555555555571';
            UPDATE \"FeatTranslations\" SET \"Name\" = 'Outdated' WHERE \"FeatId\" = '11111111-2222-3333-4444-555555555571';"
          dotnet run --project RealmForge/RealmForge.Api --no-launch-profile > api2.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/api/feats >/dev/null && break; sleep 2; done
          detail=$(curl -sf "http://localhost:5080/api/feats/11111111-2222-3333-4444-555555555571?lang=1")
          name=$(echo "$detail" | jq -r .name); pre=$(echo "$detail" | jq -r .prerequisite)
          echo "::notice title=database::after resync: name='$name' prerequisite='$pre'"
          test "$name" = "Keen Mind"
          test "$pre" = "Level 4+, Intelligence 13+"

      - name: Check species re-sync on a database seeded by the old seeders
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONN }}
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          set -e
          q() { psql -h localhost -U postgres -d realm_forge_ci -tAc "$1"; }
          restart() {
            pkill -f RealmForge.Api || true; sleep 3
            dotnet run --project RealmForge/RealmForge.Api --no-launch-profile > "$1" 2>&1 &
            for i in $(seq 1 60); do curl -sf http://localhost:5080/api/feats >/dev/null && break; sleep 2; done
          }
          elf=20000000-0000-0000-0000-000000000005
          expected=$(q "SELECT count(*) FROM \"Traits\" WHERE \"IsOfficialSRD\"")
          # Old-style data: a stale SRD trait with a random id, an outdated trait name, a Homebrew lineage on an SRD species
          q "INSERT INTO \"Traits\" (\"Id\",\"RequiredLevel\",\"SpeciesId\",\"Ruleset\",\"IsOfficialSRD\") VALUES ('bbbbbbbb-0000-0000-0000-000000000001',1,'$elf',2,true);
             INSERT INTO \"TraitTranslations\" (\"Id\",\"TraitId\",\"Language\",\"Name\",\"Description\") VALUES ('bbbbbbbb-0000-0000-0000-000000000002','bbbbbbbb-0000-0000-0000-000000000001',1,'Stale trait','x');
             UPDATE \"TraitTranslations\" SET \"Name\" = 'Outdated' WHERE \"Name\" = 'Darkvision';
             INSERT INTO \"Subspecies\" (\"Id\",\"SpeciesId\",\"Ruleset\",\"IsOfficialSRD\") VALUES ('cccccccc-0000-0000-0000-000000000001','$elf',2,false);
             INSERT INTO \"SubspeciesTranslations\" (\"Id\",\"SubspeciesId\",\"Language\",\"Name\",\"Description\") VALUES ('cccccccc-0000-0000-0000-000000000002','cccccccc-0000-0000-0000-000000000001',1,'Homebrew Elf','x');
             DELETE FROM \"Traits\" WHERE \"SpeciesId\" = '$elf' AND \"IsOfficialSRD\" AND \"Id\" <> 'bbbbbbbb-0000-0000-0000-000000000001';
             DELETE FROM \"SpeciesTranslations\" WHERE \"SpeciesId\" = '$elf' AND \"Language\" = 2;
             DELETE FROM \"Subspecies\" WHERE \"Id\" = '20000000-0000-0000-0005-000000000001';" >/dev/null
          # The rows deleted above (Elf base traits, Italian Elf name, Drow lineage) must be re-created by the sync
          restart api4.log
          stale=$(q "SELECT count(*) FROM \"Traits\" WHERE \"Id\" = 'bbbbbbbb-0000-0000-0000-000000000001'")
          outdated=$(q "SELECT count(*) FROM \"TraitTranslations\" WHERE \"Name\" = 'Outdated'")
          homebrew=$(q "SELECT count(*) FROM \"Subspecies\" WHERE \"Id\" = 'cccccccc-0000-0000-0000-000000000001'")
          after=$(q "SELECT count(*) FROM \"Traits\" WHERE \"IsOfficialSRD\"")
          ids1=$(q "SELECT md5(string_agg(\"Id\"::text, ',' ORDER BY \"Id\")) FROM \"Traits\"")
          restart api5.log
          ids2=$(q "SELECT md5(string_agg(\"Id\"::text, ',' ORDER BY \"Id\")) FROM \"Traits\"")
          elf_it=$(q "SELECT count(*) FROM \"SpeciesTranslations\" WHERE \"SpeciesId\" = '$elf' AND \"Language\" = 2")
          drow=$(q "SELECT count(*) FROM \"Subspecies\" WHERE \"Id\" = '20000000-0000-0000-0005-000000000001'")
          v5=$(q "SELECT count(*) FROM \"Traits\" WHERE \"IsOfficialSRD\" AND substring(\"Id\"::text,15,1)='5'")
          echo "::notice title=database::species resync (re-created rows): Elf IT name=$elf_it, Drow lineage=$drow, deterministic SRD trait ids=$v5"
          test "$elf_it" = "1"
          test "$drow" = "1"
          test "$v5" = "$expected"
          echo "::notice title=database::species resync: stale SRD trait left=$stale, outdated names left=$outdated, homebrew lineage kept=$homebrew, SRD traits=$after/$expected, ids stable across restarts=$([ "$ids1" = "$ids2" ] && echo yes || echo no)"
          test "$stale" = "0"
          test "$outdated" = "0"
          test "$homebrew" = "1"
          test "$after" = "$expected"
          test "$ids1" = "$ids2"

      - name: Check authentication and Homebrew ownership
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: ${{ env.CONN }}
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          set -e
          api=http://localhost:5080
          if ! curl -sf $api/api/feats >/dev/null; then
            dotnet run --project RealmForge/RealmForge.Api --no-launch-profile > api3.log 2>&1 &
            for i in $(seq 1 60); do curl -sf $api/api/feats >/dev/null && break; sleep 2; done
          fi
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          json='-H Content-Type:application/json'

          # Random throwaway password generated per run (meets Identity's default rules)
          PW="Rf-$(openssl rand -hex 12)A!"
          cred() { jq -nc --arg e "$1" --arg p "$PW" '{email:$e,password:$p}'; }
          test "$(code -X POST $api/api/auth/register $json -d "$(cred alice@example.com)")" = "200"
          test "$(code -X POST $api/api/auth/register $json -d "$(cred bob@example.com)")" = "200"
          A=$(curl -sf -X POST $api/api/auth/login $json -d "$(cred alice@example.com)" | jq -r .accessToken)
          B=$(curl -sf -X POST $api/api/auth/login $json -d "$(cred bob@example.com)" | jq -r .accessToken)
          # Nicknames: what the other players see instead of the e-mail; never two equal ones (whatever the case)
          nick_a=$(code -X PUT $api/api/account/nickname $json -H "Authorization: Bearer $A" -d '{"nickname":"Alice"}')
          nick_b=$(code -X PUT $api/api/account/nickname $json -H "Authorization: Bearer $B" -d '{"nickname":"Bob"}')
          nick_taken=$(code -X PUT $api/api/account/nickname $json -H "Authorization: Bearer $B" -d '{"nickname":"ALICE"}')
          nick_bad=$(code -X PUT $api/api/account/nickname $json -H "Authorization: Bearer $B" -d '{"nickname":"x"}')
          nick_summary=$(curl -sf $api/api/account/summary -H "Authorization: Bearer $A" | jq -r .nickname)
          echo "::notice title=database::nicknames: alice=$nick_a bob=$nick_b taken=$nick_taken invalid=$nick_bad summary=$nick_summary"
          test "$nick_a" = "200" && test "$nick_b" = "200" && test "$nick_taken" = "409" && test "$nick_bad" = "400" && test "$nick_summary" = "Alice"


          feat='{"category":2,"ruleset":2,"prerequisites":{"minimumLevel":4,"abilities":[1],"minimumScore":13},"translations":[{"language":1,"name":"Forge Test","description":"x","prerequisiteNote":"Dwarf"},{"language":2,"name":"Prova Forgia","description":"x","prerequisiteNote":"Nano"}]}'

          # E-mail confirmation: without SMTP the API logs the confirmation link; creating content needs a confirmed address
          feat_unconfirmed=$(curl -s -o /dev/null -D - -X POST $api/api/feats $json -H "Authorization: Bearer $A" -d "$feat" \
            | tr -d '\r' | awk 'NR==1{print $2} tolower($1)=="x-realmforge-error:"{print $2}' | paste -sd' ')
          confirm() {
            link=$(grep -rhoE "for $1: [^ ]+" --include='*.log' . | tail -1 | sed 's/^.*: //')
            test -n "$link"
            code "$api/api/auth/confirmEmail?${link#*\?}"
          }
          confirm_bad=$(code "$api/api/auth/confirmEmail?userId=00000000-0000-0000-0000-000000000000&code=bad")
          confirm_a=$(confirm alice@example.com); confirm_b=$(confirm bob@example.com)
          confirmed=$(curl -sf $api/api/auth/manage/info -H "Authorization: Bearer $A" | jq .isEmailConfirmed)
          echo "::notice title=database::e-mail: unconfirmed create=$feat_unconfirmed | bad link=$confirm_bad | confirm alice=$confirm_a bob=$confirm_b | alice confirmed=$confirmed"
          if [ "$confirm_a" != "200" ]; then
            grep -rh -A12 -E "fail: |Exception" --include='*.log' . | grep -v '^--$' | head -40 | sed 's/^/::error title=api-log::/'
          fi
          test "$feat_unconfirmed" = "403 EmailNotConfirmed" && test "$confirm_bad" = "401" && test "$confirm_a" = "200" && test "$confirm_b" = "200" && test "$confirmed" = "true"

          # Password recovery (separate account, so alice's and bob's sessions stay valid): the logged link opens the
          # client page /reset-password with email and code; the code works once and the new password signs in
          test "$(code -X POST $api/api/auth/register $json -d "$(cred carol@example.com)")" = "200"
          test "$(confirm carol@example.com)" = "200"
          forgot_unknown=$(code -X POST $api/api/auth/forgotPassword $json -d '{"email":"nobody@example.com"}')
          forgot=$(code -X POST $api/api/auth/forgotPassword $json -d '{"email":"carol@example.com"}')
          sleep 1
          reset_link=$(grep -rhoE "Reset your password for carol@example.com: [^ ]+" --include='*.log' . | tail -1 | sed 's/^.*: //')
          reset_code=$(echo "$reset_link" | grep -oE '[?&]code=[^&]+' | cut -d= -f2-)
          NEWPW="Rf-$(openssl rand -hex 12)B!"
          reset_body=$(jq -nc --arg c "$reset_code" --arg p "$NEWPW" '{email:"carol@example.com",resetCode:$c,newPassword:$p}')
          reset=$(code -X POST $api/api/auth/resetPassword $json -d "$reset_body")
          reset_again=$(curl -s -X POST $api/api/auth/resetPassword $json -d "$reset_body" | jq -r '.errors | keys | join(",")')
          login_old=$(code -X POST $api/api/auth/login $json -d "$(cred carol@example.com)")
          login_new=$(code -X POST $api/api/auth/login $json -d "$(jq -nc --arg p "$NEWPW" '{email:"carol@example.com",password:$p}')")
          echo "::notice title=database::password reset: unknown address=$forgot_unknown | forgot=$forgot | link page=$(echo "$reset_link" | grep -oE '/reset-password\?email=[^&]+' ) | reset=$reset | code reused=$reset_again | old password=$login_old | new password=$login_new"
          test "$forgot_unknown" = "200" && test "$forgot" = "200" && test -n "$reset_code" && test "$reset" = "200" && test "$reset_again" = "InvalidToken" && test "$login_old" = "401" && test "$login_new" = "200"

          anon_create=$(code -X POST $api/api/feats $json -d "$feat")
          created=$(curl -sf -X POST "$api/api/feats?lang=2" $json -H "Authorization: Bearer $A" -d "$feat")
          id=$(echo "$created" | jq -r .id); pre=$(echo "$created" | jq -r .prerequisite); can=$(echo "$created" | jq -r .canEdit)
          # Visibility: new Homebrew is private; "link" makes it readable but not listed; "public" lists it
          listed() { curl -sf "$api/api/feats" "$@" | jq --arg id "$id" '[.[] | select(.id == $id)] | length'; }
          vis_default=$(echo "$created" | jq .visibility)
          b_private=$(code "$api/api/feats/$id" -H "Authorization: Bearer $B"); anon_private=$(code "$api/api/feats/$id")
          list_private="anon=$(listed) bob=$(listed -H "Authorization: Bearer $B") alice=$(listed -H "Authorization: Bearer $A")"
          # Sharing with a chosen account: bob reads and lists the private feat, until alice removes him
          share_bob=$(code -X POST "$api/api/shares/content/$id" $json -H "Authorization: Bearer $A" -d '{"email":"bob@example.com"}')
          share_nobody=$(code -X POST "$api/api/shares/content/$id" $json -H "Authorization: Bearer $A" -d '{"email":"nobody@example.com"}')
          share_by_bob=$(code -X POST "$api/api/shares/content/$id" $json -H "Authorization: Bearer $B" -d '{"email":"alice@example.com"}')
          people=$(curl -sf "$api/api/shares/content/$id" -H "Authorization: Bearer $A")
          shared_bob="detail=$(code "$api/api/feats/$id" -H "Authorization: Bearer $B") listed=$(listed -H "Authorization: Bearer $B") people=$(echo "$people" | jq -r '[.[].email] | join(",")')"
          unshare_bob=$(code -X DELETE "$api/api/shares/content/$id/$(echo "$people" | jq -r '.[0].userId')" -H "Authorization: Bearer $A")
          unshared_bob="detail=$(code "$api/api/feats/$id" -H "Authorization: Bearer $B") listed=$(listed -H "Authorization: Bearer $B")"
          echo "::notice title=database::sharing: share=$share_bob unknown=$share_nobody by other=$share_by_bob | shared $shared_bob | unshare=$unshare_bob then $unshared_bob"
          test "$share_bob" = "200" && test "$share_nobody" = "404" && test "$share_by_bob" = "404"
          test "$shared_bob" = "detail=200 listed=1 people=bob@example.com" && test "$unshare_bob" = "204" && test "$unshared_bob" = "detail=404 listed=0"
          update=$(echo "$feat" | jq --arg id "$id" '. + {id: $id, visibility: 1}')
          link_update=$(code -X PUT $api/api/feats/$id $json -H "Authorization: Bearer $A" -d "$update")
          anon_link=$(code "$api/api/feats/$id"); list_link=$(listed)
          # A link-only entry added to bob's collection is listed for him (and in his character creation) until he removes it
          collect_bob="collect=$(code -X POST "$api/api/shares/content/$id/collect" -H "Authorization: Bearer $B") listed=$(listed -H "Authorization: Bearer $B") mine=$(curl -sf "$api/api/shares/content/mine" -H "Authorization: Bearer $B" | jq -c '[.[] | .collected]') leave=$(code -X DELETE "$api/api/shares/content/$id/me" -H "Authorization: Bearer $B") after=$(listed -H "Authorization: Bearer $B")"
          echo "::notice title=database::collection: $collect_bob"
          test "$collect_bob" = "collect=204 listed=1 mine=[true] leave=204 after=0"
          update=$(echo "$feat" | jq --arg id "$id" '. + {id: $id, visibility: 0}')
          own_update=$(code -X PUT $api/api/feats/$id $json -H "Authorization: Bearer $A" -d "$update")
          list_public=$(listed)
          echo "::notice title=database::visibility: default=$vis_default | private detail bob=$b_private anon=$anon_private | private listed $list_private | link PUT=$link_update detail anon=$anon_link listed=$list_link | public listed=$list_public"
          test "$vis_default" = "2" && test "$b_private" = "404" && test "$anon_private" = "404" && test "$list_private" = "anon=0 bob=0 alice=1"
          test "$link_update" = "204" && test "$anon_link" = "200" && test "$list_link" = "0" && test "$list_public" = "1"
          other_update=$(code -X PUT $api/api/feats/$id $json -H "Authorization: Bearer $B" -d "$update")
          other_delete=$(code -X DELETE $api/api/feats/$id -H "Authorization: Bearer $B")
          srd_delete=$(code -X DELETE $api/api/feats/11111111-2222-3333-4444-555555555571 -H "Authorization: Bearer $A")
          b_can=$(curl -sf "$api/api/feats/$id" -H "Authorization: Bearer $B" | jq -r .canEdit)
          own_delete=$(code -X DELETE $api/api/feats/$id -H "Authorization: Bearer $A")

          echo "::notice title=database::auth: anonymous create=$anon_create | created prerequisite='$pre' canEdit=$can | own PUT=$own_update | other PUT=$other_update DELETE=$other_delete canEdit=$b_can | SRD DELETE=$srd_delete | own DELETE=$own_delete"
          test "$anon_create" = "401"
          test "$pre" = "Livello 4+, Forza 13+, Nano"
          test "$can" = "true"
          test "$own_update" = "204"
          test "$other_update" = "403"
          test "$other_delete" = "403"
          test "$b_can" = "false"
          test "$srd_delete" = "403"
          test "$own_delete" = "204"

          # Backgrounds: homebrew creation with an origin feat, localized feat name, ownership and validation
          alert=11111111-2222-3333-4444-555555555544
          bg=$(jq -nc --arg f "$alert" '{ruleset:2, abilityOptions:[4,5,6], skillProficiencies:[7,15], originFeatId:$f, equipmentGoldAlternative:50, visibility:1,
            translations:[{language:1,name:"Test Acolyte",description:"x",originFeatNote:"Cleric list"},{language:2,name:"Accolito di prova",description:"x",originFeatNote:"lista del Chierico"}]}')
          bg_anon=$(code -X POST $api/api/backgrounds $json -d "$bg")
          bg_created=$(curl -sf -X POST "$api/api/backgrounds?lang=2" $json -H "Authorization: Bearer $A" -d "$bg")
          bg_id=$(echo "$bg_created" | jq -r .id); bg_feat=$(echo "$bg_created" | jq -r .originFeatName); bg_skills=$(echo "$bg_created" | jq -c .skillProficiencies); bg_gold=$(echo "$bg_created" | jq .equipmentGoldAlternative)
          bg_bad_gold=$(code -X POST $api/api/backgrounds $json -H "Authorization: Bearer $A" -d "$(echo "$bg" | jq '.equipmentGoldAlternative = -1')")
          bg_bad=$(code -X POST $api/api/backgrounds $json -H "Authorization: Bearer $A" -d "$(echo "$bg" | jq '.originFeatId = "00000000-0000-0000-0000-000000000001"')")
          bg_other=$(code -X PUT $api/api/backgrounds/$bg_id $json -H "Authorization: Bearer $B" -d "$(echo "$bg" | jq --arg id "$bg_id" '. + {id:$id}')")
          bg_en=$(curl -sf "$api/api/backgrounds/$bg_id?lang=1" | jq -r '.originFeatName + " / " + .originFeatNote')
          # Account summary: own data and Homebrew counts while alice's background exists
          acc_anon=$(code $api/api/account/summary)
          acc=$(curl -sf $api/api/account/summary -H "Authorization: Bearer $A" | jq -c '{email, isAdmin, registered: (.registeredAt != null), backgrounds: .homebrew.backgrounds}')
          acc_bob=$(curl -sf $api/api/account/summary -H "Authorization: Bearer $B" | jq -c '.homebrew.backgrounds')
          echo "::notice title=database::account: anonymous=$acc_anon | alice=$acc | bob backgrounds=$acc_bob"
          test "$acc_anon" = "401" && test "$acc" = '{"email":"alice@example.com","isAdmin":false,"registered":true,"backgrounds":1}' && test "$acc_bob" = "0"
          bg_delete=$(code -X DELETE $api/api/backgrounds/$bg_id -H "Authorization: Bearer $A")
          echo "::notice title=database::backgrounds: anonymous create=$bg_anon | created feat(IT)='$bg_feat' skills=$bg_skills gold=$bg_gold (negative=$bg_bad_gold) | EN='$bg_en' | unknown feat=$bg_bad | other PUT=$bg_other | own DELETE=$bg_delete"
          test "$bg_gold" = "50" && test "$bg_bad_gold" = "400"
          bg_srd=$(curl -sf "$api/api/backgrounds?isOfficial=true&ruleset=1&lang=2" | jq -c '[.[] | {name, skills: .skillProficiencies, source}] | sort_by(.name)')
          echo "::notice title=database::base backgrounds: $bg_srd"
          test "$bg_srd" = '[{"name":"Accolito","skills":[7,15],"source":2},{"name":"Artigiano di Gilda","skills":[7,14],"source":1},{"name":"Ciarlatano","skills":[5,16],"source":1},{"name":"Criminale","skills":[5,17],"source":1},{"name":"Eremita","skills":[10,15],"source":1},{"name":"Eroe Popolare","skills":[2,18],"source":1},{"name":"Forestiero","skills":[4,18],"source":1},{"name":"Intrattenitore","skills":[1,13],"source":1},{"name":"Marinaio","skills":[4,12],"source":1},{"name":"Monello","skills":[16,17],"source":1},{"name":"Nobile","skills":[6,14],"source":1},{"name":"Sapiente","skills":[3,6],"source":1},{"name":"Soldato","skills":[4,8],"source":1}]'
          bg_2024=$(curl -sf "$api/api/backgrounds?isOfficial=true&ruleset=2&lang=2" | jq -c '[.[] | {name, abilities: .abilityOptions, skills: .skillProficiencies, feat: .originFeatName, source}] | sort_by(.name)')
          echo "::notice title=database::base backgrounds 2024: $bg_2024"
          test "$bg_2024" = '[{"name":"Accolito","abilities":[4,5,6],"skills":[7,15],"feat":"Iniziato alla Magia","source":3},{"name":"Artigiano","abilities":[1,2,4],"skills":[9,14],"feat":"Lavoro Manuale","source":1},{"name":"Ciarlatano","abilities":[2,3,6],"skills":[5,16],"feat":"Abile","source":1},{"name":"Contadino","abilities":[1,3,5],"skills":[2,11],"feat":"Robusto","source":1},{"name":"Criminale","abilities":[2,3,4],"skills":[16,17],"feat":"Allerta","source":3},{"name":"Eremita","abilities":[3,5,6],"skills":[10,15],"feat":"Guaritore","source":1},{"name":"Guardia","abilities":[1,4,5],"skills":[4,12],"feat":"Allerta","source":1},{"name":"Guida","abilities":[2,3,5],"skills":[17,18],"feat":"Iniziato alla Magia","source":1},{"name":"Intrattenitore","abilities":[1,2,6],"skills":[1,13],"feat":"Musicista","source":1},{"name":"Marinaio","abilities":[1,2,5],"skills":[1,12],"feat":"Lottatore da Taverna","source":1},{"name":"Mercante","abilities":[3,4,6],"skills":[2,14],"feat":"Fortunato","source":1},{"name":"Nobile","abilities":[1,4,6],"skills":[6,14],"feat":"Abile","source":1},{"name":"Sapiente","abilities":[3,4,5],"skills":[3,6],"feat":"Iniziato alla Magia","source":3},{"name":"Scriba","abilities":[2,4,5],"skills":[9,12],"feat":"Abile","source":1},{"name":"Soldato","abilities":[1,2,3],"skills":[4,8],"feat":"Aggressore Selvaggio","source":3},{"name":"Viandante","abilities":[2,5,6],"skills":[7,17],"feat":"Fortunato","source":1}]'
          sources=$(curl -sf "$api/api/feats?isOfficial=true" | jq -c '[.[].source] | unique')
          acolyte_source=$(curl -sf "$api/api/backgrounds?isOfficial=true&ruleset=1&lang=1" | jq -r '.[] | select(.name == "Acolyte") | .source')
          homebrew_source=$(echo "$created" | jq -r .source)
          echo "::notice title=database::sources: base feats=$sources | Acolyte=$acolyte_source | homebrew=$homebrew_source"
          test "$sources" = "[1,2,3]"
          test "$acolyte_source" = "2"
          test "$homebrew_source" = "null"
          test "$bg_anon" = "401"
          test "$bg_feat" = "Allerta"
          test "$bg_skills" = "[7,15]"
          test "$bg_en" = "Alert / Cleric list"
          test "$bg_bad" = "400"
          test "$bg_other" = "403"
          test "$bg_delete" = "204"

          # Like curl -sf, but reports the status and the start of the body when a request fails
          get() { local out status; out=$(curl -s -w '\n%{http_code}' "$@"); status=${out##*$'\n'}; out=${out%$'\n'*}
            if [ "${status:0:1}" != "2" ]; then echo "::error title=spells::HTTP $status for $*: $(printf '%s' "$out" | tr '\n' ' ' | head -c 400)" >&2; grep -E "fail|Exception" api.log 2>/dev/null | tail -5 | sed 's/^/::error title=api-log::/' >&2; return 22; fi
            printf '%s' "$out"; }
          # Spells: 361 base spells of the 2014 rules (319 SRD 5.1 + 42 RealmForge texts) and 391 of the 2024 rules
          # (339 SRD 5.2 + 52 RealmForge texts), server-side filters, localized stat block and Homebrew rules (ownership, validation)
          sp_all=$(get "$api/api/spells?isOfficial=true&ruleset=1&lang=2")
          sp_counts=$(echo "$sp_all" | jq -c '{total: length, srd: map(select(.source == 2)) | length, rf: map(select(.source == 1)) | length, cantrips: map(select(.level == 0)) | length, ninth: map(select(.level == 9)) | length}')
          sp_wizard3=$(get "$api/api/spells?isOfficial=true&ruleset=1&lang=2&level=3&spellClass=8" | jq length)
          sp_school=$(get "$api/api/spells?isOfficial=true&ruleset=1&lang=2&school=5&level=3" | jq -c '[.[].name] | sort | .[0:3]')
          fireball=$(echo "$sp_all" | jq -r '.[] | select(.name == "Palla di Fuoco") | .id')
          fb_it=$(get "$api/api/spells/$fireball?lang=2" | jq -c '{name, range, castingTime, duration, components: [.verbal, .somatic, .material], material: .materialComponent, classes}')
          fb_en=$(get "$api/api/spells/$fireball?lang=1" | jq -r '.name + " / " + .range + " / " + .higherLevels[0:40]')
          hex_src=$(get "$api/api/spells?isOfficial=true&ruleset=1&lang=1" | jq -c '.[] | select(.name == "Hex") | {source, concentration, castingTime}')
          sp24_all=$(get "$api/api/spells?isOfficial=true&ruleset=2&lang=2")
          sp24_counts=$(echo "$sp24_all" | jq -c '{total: length, srd: map(select(.source == 3)) | length, rf: map(select(.source == 1)) | length, cantrips: map(select(.level == 0)) | length, ninth: map(select(.level == 9)) | length, rituals: map(select(.ritual)) | length}')
          sp24_wizard3=$(get "$api/api/spells?isOfficial=true&ruleset=2&lang=2&level=3&spellClass=8" | jq length)
          sp_both=$(get "$api/api/spells?isOfficial=true&lang=2" | jq length)
          fireball24=$(echo "$sp24_all" | jq -r '.[] | select(.name == "Palla di Fuoco") | .id')
          fb24_it=$(get "$api/api/spells/$fireball24?lang=2" | jq -c '{name, range, castingTime, duration, material: .materialComponent, ruleset}')
          fb24_en=$(get "$api/api/spells/$fireball24?lang=1" | jq -r '.name + " / " + .castingTime + " / " + .higherLevels[0:40]')
          hex24_src=$(get "$api/api/spells?isOfficial=true&ruleset=2&lang=1" | jq -c '.[] | select(.name == "Hex") | {source, castingTime}')
          fey24=$(echo "$sp24_all" | jq -c '.[] | select(.name == "Richiama Folletto") | {source, level}')
          sp=$(jq -nc '{ruleset:1, level:2, school:5, classes:[8,6], concentration:true, verbal:true, somatic:true, material:false, visibility:2,
            translations:[{language:1,name:"Test Bolt",description:"x",castingTime:"1 action",range:"60 feet",duration:"Concentration, up to 1 minute"},
                          {language:2,name:"Dardo di prova",description:"x",castingTime:"1 azione",range:"18 metri",duration:"Concentrazione, fino a 1 minuto"}]}')
          sp_anon=$(code -X POST $api/api/spells $json -d "$sp")
          sp_created=$(get -X POST "$api/api/spells?lang=2" $json -H "Authorization: Bearer $A" -d "$sp")
          sp_id=$(echo "$sp_created" | jq -r .id); sp_classes=$(echo "$sp_created" | jq -c .classes); sp_can=$(echo "$sp_created" | jq -r .canEdit)
          sp_bad_level=$(code -X POST $api/api/spells $json -H "Authorization: Bearer $A" -d "$(echo "$sp" | jq '.level = 10')")
          sp_bad_stats=$(code -X POST $api/api/spells $json -H "Authorization: Bearer $A" -d "$(echo "$sp" | jq '.translations[0].range = ""')")
          sp_other=$(code -X PUT $api/api/spells/$sp_id $json -H "Authorization: Bearer $B" -d "$(echo "$sp" | jq --arg id "$sp_id" '. + {id:$id}')")
          sp_own=$(code -X PUT $api/api/spells/$sp_id $json -H "Authorization: Bearer $A" -d "$(echo "$sp" | jq --arg id "$sp_id" '. + {id:$id, level:3}')")
          sp_level=$(get "$api/api/spells/$sp_id?lang=1" -H "Authorization: Bearer $A" | jq .level)
          sp_anon_detail=$(code "$api/api/spells/$sp_id?lang=1")
          sp_listed=$(get "$api/api/spells?lang=2&isOfficial=false" -H "Authorization: Bearer $A" | jq length)
          sp_anon_listed=$(get "$api/api/spells?lang=2&isOfficial=false" | jq length)
          sp_acc=$(get $api/api/account/summary -H "Authorization: Bearer $A" | jq .homebrew.spells)
          sp_srd_delete=$(code -X DELETE $api/api/spells/$fireball -H "Authorization: Bearer $A")
          sp_delete=$(code -X DELETE $api/api/spells/$sp_id -H "Authorization: Bearer $A")
          echo "::notice title=database::spells: $sp_counts | wizard 3rd=$sp_wizard3 | evocation 3rd=$sp_school | fireball IT=$fb_it | EN='$fb_en' | Hex=$hex_src"
          echo "::notice title=database::spells 2024: $sp24_counts | wizard 3rd=$sp24_wizard3 | both editions=$sp_both | fireball IT=$fb24_it | EN='$fb24_en' | Hex=$hex24_src | Summon Fey=$fey24"
          echo "::notice title=database::spell homebrew: anonymous=$sp_anon | classes=$sp_classes canEdit=$sp_can | level 10=$sp_bad_level | empty range=$sp_bad_stats | other PUT=$sp_other | own PUT=$sp_own (level $sp_level) | private detail anon=$sp_anon_detail | private listed author=$sp_listed anon=$sp_anon_listed | account spells=$sp_acc | SRD DELETE=$sp_srd_delete | own DELETE=$sp_delete"
          test "$sp_counts" = '{"total":361,"srd":319,"rf":42,"cantrips":27,"ninth":16}'
          test "$sp_wizard3" = "29"
          test "$fb_it" = '{"name":"Palla di Fuoco","range":"45 metri","castingTime":"1 azione","duration":"Istantanea","components":[true,true,true],"material":"una minuscola pallina di guano di pipistrello e zolfo","classes":[6,8]}'
          test "$fb_en" = "Fireball / 150 feet / When you cast this spell using a spell s"
          test "$hex_src" = '{"source":1,"concentration":true,"castingTime":"1 bonus action"}'
          test "$sp24_counts" = '{"total":391,"srd":339,"rf":52,"cantrips":34,"ninth":16,"rituals":31}'
          test "$sp24_wizard3" = "32" && test "$sp_both" = "752"
          test "$fb24_it" = '{"name":"Palla di Fuoco","range":"45 metri","castingTime":"Azione","duration":"Istantanea","material":"una pallina di guano di pipistrello e zolfo","ruleset":2}'
          test "$fb24_en" = "Fireball / Action / The damage increases by 1d6 for each spe"
          test "$hex24_src" = '{"source":3,"castingTime":"Bonus Action"}'
          test "$fey24" = '{"source":1,"level":3}'
          test "$sp_anon" = "401" && test "$sp_classes" = "[6,8]" && test "$sp_can" = "true"
          test "$sp_bad_level" = "400" && test "$sp_bad_stats" = "400" && test "$sp_other" = "403" && test "$sp_own" = "204" && test "$sp_level" = "3" && test "$sp_anon_detail" = "404"
          test "$sp_listed" = "1" && test "$sp_anon_listed" = "0" && test "$sp_acc" = "1" && test "$sp_srd_delete" = "403" && test "$sp_delete" = "204"

          # Classes: 12 base classes of the 2014 rules (SRD 5.1) with 40 subclasses (12 SRD + 28 RealmForge texts),
          # full sheet in both languages and Homebrew rules (subclass under a Base class, ownership, validation)
          cl_all=$(get "$api/api/classes?isOfficial=true&ruleset=1&lang=2")
          cl_counts=$(echo "$cl_all" | jq -c '{total: length, srd: map(select(.source == 2)) | length, subclasses: map(.subclassNames | length) | add, casters: map(select(.casterProgression != 0)) | length}')
          wizard=$(echo "$cl_all" | jq -r '.[] | select(.name == "Mago") | .id')
          wz_it=$(get "$api/api/classes/$wizard?lang=2" | jq -c '{name, hitDie, subclassLevel, subclassTitle, features: (.features | length), subclasses: (.subclasses | length), rf: (.subclasses | map(select(.source == 1)) | length), first: .features[0].name}')
          wz_en=$(get "$api/api/classes/$wizard?lang=1" | jq -r '.name + " / " + .subclassTitle + " / " + (.subclasses | map(select(.source == 2)) | .[0].name)')
          rogue=$(echo "$cl_all" | jq -r '.[] | select(.name == "Ladro") | .id')
          trickster=$(get "$api/api/classes/$rogue?lang=2" | jq -r '.subclasses[] | select(.name == "Mistificatore Arcano") | .id')
          at_it=$(get "$api/api/subclasses/$trickster?lang=2" | jq -c '{className, casterProgression, spellcastingAbility, source, features: (.features | map(.level))}')
          # 2024 rules (SRD 5.2): 12 classes with 48 subclasses (12 SRD + 36 RealmForge texts), subclass at level 3
          cl24=$(get "$api/api/classes?isOfficial=true&ruleset=2&lang=2")
          cl24_counts=$(echo "$cl24" | jq -c '{total: length, srd: map(select(.source == 3)) | length, subclasses: map(.subclassNames | length) | add, casters: map(select(.casterProgression != 0)) | length}')
          wizard24=$(echo "$cl24" | jq -r '.[] | select(.name == "Mago") | .id')
          wz24_it=$(get "$api/api/classes/$wizard24?lang=2" | jq -c '{name, hitDie, subclassLevel, subclassTitle, features: (.features | length), subclasses: (.subclasses | length), rf: (.subclasses | map(select(.source == 1)) | length), first: .features[0].name}')
          wz24_en=$(get "$api/api/classes/$wizard24?lang=1" | jq -r '.name + " / " + .subclassTitle + " / " + (.subclasses | map(select(.source == 3)) | .[0].name)')
          cl=$(jq -nc '{ruleset:1, hitDie:10, primaryAbilities:[1], savingThrows:[1,3], skillChoiceCount:2, skillOptions:[], casterProgression:0, subclassLevel:3, visibility:2,
            translations:[{language:1,name:"Test Knight",description:"x"},{language:2,name:"Cavaliere di prova",description:"x"}],
            features:[{level:1,translations:[{language:1,name:"Oath",description:"x"},{language:2,name:"Giuramento",description:"x"}]}]}')
          cl_anon=$(code -X POST $api/api/classes $json -d "$cl")
          cl_id=$(get -X POST $api/api/classes $json -H "Authorization: Bearer $A" -d "$cl" | jq -r .id)
          cl_bad_die=$(code -X POST $api/api/classes $json -H "Authorization: Bearer $A" -d "$(echo "$cl" | jq '.hitDie = 7')")
          cl_bad_level=$(code -X POST $api/api/classes $json -H "Authorization: Bearer $A" -d "$(echo "$cl" | jq '.features[0].level = 21')")
          cl_bad_caster=$(code -X POST $api/api/classes $json -H "Authorization: Bearer $A" -d "$(echo "$cl" | jq '.casterProgression = 1')")
          cl_other=$(code -X PUT $api/api/classes/$cl_id $json -H "Authorization: Bearer $B" -d "$(echo "$cl" | jq --arg id "$cl_id" '. + {id:$id}')")
          cl_own=$(code -X PUT $api/api/classes/$cl_id $json -H "Authorization: Bearer $A" -d "$(echo "$cl" | jq --arg id "$cl_id" '. + {id:$id, hitDie:12}')")
          cl_detail=$(get "$api/api/classes/$cl_id?lang=1" -H "Authorization: Bearer $A" | jq -c '{hitDie, features: (.features | length), canEdit}')
          cl_anon_detail=$(code "$api/api/classes/$cl_id?lang=1")
          sub=$(jq -nc --arg c "$wizard" '{classId:$c, casterProgression:0, visibility:2,
            translations:[{language:1,name:"School of Tests",description:"x"},{language:2,name:"Scuola di Prova",description:"x"}],
            features:[{level:2,translations:[{language:1,name:"Savant",description:"x"},{language:2,name:"Sapiente",description:"x"}]}]}')
          sub_base=$(get -X POST $api/api/subclasses $json -H "Authorization: Bearer $A" -d "$sub" | jq -r .id)
          sub_other_class=$(code -X POST $api/api/subclasses $json -H "Authorization: Bearer $B" -d "$(echo "$sub" | jq --arg c "$cl_id" '.classId = $c')")
          sub_own_class=$(code -X POST $api/api/subclasses $json -H "Authorization: Bearer $A" -d "$(echo "$sub" | jq --arg c "$cl_id" '.classId = $c')")
          sub_listed=$(get "$api/api/classes/$wizard?lang=2" -H "Authorization: Bearer $A" | jq '.subclasses | length')
          sub_anon_listed=$(get "$api/api/classes/$wizard?lang=2" | jq '.subclasses | length')
          sub_other_put=$(code -X PUT $api/api/subclasses/$sub_base $json -H "Authorization: Bearer $B" -d "$(echo "$sub" | jq --arg id "$sub_base" '. + {id:$id}')")
          cl_acc=$(get $api/api/account/summary -H "Authorization: Bearer $A" | jq -c '[.homebrew.classes, .homebrew.subclasses]')
          cl_srd_delete=$(code -X DELETE $api/api/classes/$wizard -H "Authorization: Bearer $A")
          sub_delete=$(code -X DELETE $api/api/subclasses/$sub_base -H "Authorization: Bearer $A")
          cl_delete=$(code -X DELETE $api/api/classes/$cl_id -H "Authorization: Bearer $A")
          echo "::notice title=database::classes: $cl_counts | wizard IT=$wz_it | EN='$wz_en' | Arcane Trickster=$at_it"
          echo "::notice title=database::classes 2024: $cl24_counts | wizard IT=$wz24_it | EN='$wz24_en'"
          echo "::notice title=database::class homebrew: anonymous=$cl_anon | d7=$cl_bad_die | level 21=$cl_bad_level | caster without ability=$cl_bad_caster | other PUT=$cl_other | own PUT=$cl_own ($cl_detail) | private detail anon=$cl_anon_detail | subclass on other's class=$sub_other_class on own=$sub_own_class | wizard subclasses author=$sub_listed anon=$sub_anon_listed | other subclass PUT=$sub_other_put | account=$cl_acc | SRD DELETE=$cl_srd_delete | DELETE subclass=$sub_delete class=$cl_delete"
          test "$cl_counts" = '{"total":12,"srd":12,"subclasses":40,"casters":8}'
          test "$wz_it" = '{"name":"Mago","hitDie":6,"subclassLevel":2,"subclassTitle":"Tradizione Arcana","features":6,"subclasses":8,"rf":7,"first":"Incantesimi"}'
          test "$wz_en" = "Wizard / Arcane Tradition / School of Evocation"
          test "$cl24_counts" = '{"total":12,"srd":12,"subclasses":48,"casters":8}'
          test "$wz24_it" = '{"name":"Mago","hitDie":6,"subclassLevel":3,"subclassTitle":"Sottoclasse del mago","features":10,"subclasses":4,"rf":3,"first":"Incantesimi"}'
          test "$wz24_en" = "Wizard / Wizard Subclass / Evoker"
          test "$at_it" = '{"className":"Ladro","casterProgression":3,"spellcastingAbility":4,"source":1,"features":[3,3,9,13,17]}'
          test "$cl_anon" = "401" && test "$cl_bad_die" = "400" && test "$cl_bad_level" = "400" && test "$cl_bad_caster" = "400"
          test "$cl_other" = "403" && test "$cl_own" = "204" && test "$cl_detail" = '{"hitDie":12,"features":1,"canEdit":true}' && test "$cl_anon_detail" = "404"
          test "$sub_other_class" = "403" && test "$sub_own_class" = "201" && test "$sub_listed" = "9" && test "$sub_anon_listed" = "8" && test "$sub_other_put" = "403"
          test "$cl_acc" = "[1,2]" && test "$cl_srd_delete" = "403" && test "$sub_delete" = "204" && test "$cl_delete" = "204"

          # Equipment: 242 base items of 2014 (SRD 5.1) and 208 of 2024 (SRD 5.2), Longsword 2024 in Italian and English,
          # Homebrew rules (validation of weapons and armor, ownership, account summary)
          eq14=$(get "$api/api/equipment?isOfficial=true&ruleset=1&lang=2" | jq -c '{total: length, srd: map(select(.source == 2)) | length, weapons: map(select(.stats.category == 1)) | length}')
          eq24_all=$(get "$api/api/equipment?isOfficial=true&ruleset=2&lang=2")
          eq24=$(echo "$eq24_all" | jq -c '{total: length, srd: map(select(.source == 3)) | length, weapons: map(select(.stats.category == 1)) | length, mastery: map(select(.stats.mastery != null)) | length}')
          longsword=$(echo "$eq24_all" | jq -r '.[] | select(.name == "Spada lunga") | .id')
          ls_it=$(get "$api/api/equipment/$longsword?lang=2" | jq -c '{name, cost: .stats.costInCopper, weight: .stats.weightInPounds, dice: .stats.damageDice, type: .stats.damageType, versatile: .stats.versatileDamageDice, mastery: .stats.mastery}')
          ls_en=$(get "$api/api/equipment/$longsword?lang=1" | jq -r .name)
          eq_weapons=$(get "$api/api/equipment?ruleset=2&category=1&lang=1" | jq length)
          eq=$(jq -nc '{ruleset:2, visibility:2, stats:{category:1, costInCopper:2500, weightInPounds:3, quantity:1, weaponCategory:2, weaponRange:1, damageDice:"1d8", damageType:12, weaponProperties:[2]},
            translations:[{language:1,name:"Test Blade",description:"x"},{language:2,name:"Lama di prova",description:"x"}]}')
          eq_anon=$(code -X POST $api/api/equipment $json -d "$eq")
          eq_id=$(get -X POST $api/api/equipment $json -H "Authorization: Bearer $A" -d "$eq" | jq -r .id)
          eq_bad_dice=$(code -X POST $api/api/equipment $json -H "Authorization: Bearer $A" -d "$(echo "$eq" | jq '.stats.damageDice = "x8"')")
          eq_bad_thrown=$(code -X POST $api/api/equipment $json -H "Authorization: Bearer $A" -d "$(echo "$eq" | jq '.stats.weaponProperties = [9]')")
          eq_bad_armor=$(code -X POST $api/api/equipment $json -H "Authorization: Bearer $A" -d "$(echo "$eq" | jq '.stats.category = 2 | .stats.armorClass = 40 | .stats.armorCategory = 1')")
          eq_other=$(code -X PUT $api/api/equipment/$eq_id $json -H "Authorization: Bearer $B" -d "$(echo "$eq" | jq --arg id "$eq_id" '. + {id:$id}')")
          eq_own=$(code -X PUT $api/api/equipment/$eq_id $json -H "Authorization: Bearer $A" -d "$(echo "$eq" | jq --arg id "$eq_id" '. + {id:$id} | .stats.weightInPounds = 2')")
          eq_detail=$(get "$api/api/equipment/$eq_id?lang=2" -H "Authorization: Bearer $A" | jq -c '{name, weight: .stats.weightInPounds, canEdit}')
          eq_anon_detail=$(code "$api/api/equipment/$eq_id?lang=1")
          eq_acc=$(get $api/api/account/summary -H "Authorization: Bearer $A" | jq -c .homebrew.equipment)
          eq_srd_delete=$(code -X DELETE $api/api/equipment/$longsword -H "Authorization: Bearer $A")
          eq_delete=$(code -X DELETE $api/api/equipment/$eq_id -H "Authorization: Bearer $A")
          echo "::notice title=database::equipment 2014: $eq14 | 2024: $eq24 | longsword IT=$ls_it EN='$ls_en' | 2024 weapons=$eq_weapons"
          echo "::notice title=database::equipment homebrew: anonymous=$eq_anon | bad dice=$eq_bad_dice | thrown without range=$eq_bad_thrown | AC 40=$eq_bad_armor | other PUT=$eq_other | own PUT=$eq_own ($eq_detail) | private detail anon=$eq_anon_detail | account=$eq_acc | SRD DELETE=$eq_srd_delete | DELETE=$eq_delete"
          # Each check names itself on failure (the notices above are capped per step)
          eqfail=0
          check() { if [ "$2" != "$3" ]; then echo "::error title=equipment::$1: got '$2', expected '$3'"; eqfail=1; fi; }
          check "2014 counts" "$eq14" '{"total":242,"srd":242,"weapons":37}'
          check "2024 counts" "$eq24" '{"total":208,"srd":208,"weapons":38,"mastery":38}'
          check "longsword IT" "$ls_it" '{"name":"Spada lunga","cost":1500,"weight":3,"dice":"1d8","type":12,"versatile":"1d10","mastery":5}'
          check "longsword EN" "$ls_en" "Longsword"
          check "2024 weapons" "$eq_weapons" "38"
          check "anonymous create" "$eq_anon" "401"
          check "bad dice" "$eq_bad_dice" "400"
          check "thrown without range" "$eq_bad_thrown" "400"
          check "AC 40" "$eq_bad_armor" "400"
          check "other PUT" "$eq_other" "403"
          check "own PUT" "$eq_own" "204"
          check "detail" "$eq_detail" '{"name":"Lama di prova","weight":2,"canEdit":true}'
          check "private detail anonymous" "$eq_anon_detail" "404"
          check "account" "$eq_acc" "1"
          check "SRD DELETE" "$eq_srd_delete" "403"
          check "DELETE" "$eq_delete" "204"
          test "$eqfail" = "0"

          # Magic items: 412 entries of 2014 (276 items and 136 variants; 366 from the SRD 5.1, 46 of the DMG written by
          # RealmForge), filters by category, the official Italian names, variants with their item and the rules the sheet applies
          mi_all=$(get "$api/api/magic-items?ruleset=1&lang=2")
          mi14=$(echo "$mi_all" | jq -c '{total: length, items: map(select(.parentId == null)) | length, srd: map(select(.source == 2)) | length, realmforge: map(select(.source == 1)) | length, rules: map(select(.mechanics != null)) | length}')
          mi_types=$(echo "$mi_all" | jq -c '[map(select(.parentId == null)) | group_by(.type)[] | {(.[0].type | tostring): length}] | add')
          mi_rings=$(get "$api/api/magic-items?ruleset=1&type=3&lang=1" | jq length)
          mi_names=$(echo "$mi_all" | jq -c '[.[] | select(.name == "Anello di protezione" or .name == "Armatura demoniaca" or .name == "Guanti del potere orchesco" or .name == "Lama nera") | .name] | sort')
          mi_ring=$(echo "$mi_all" | jq -c '.[] | select(.name == "Anello di protezione") | {rarity, attunement: .requiresAttunement, effects: [.mechanics.effects[] | [.kind, .value]]}')
          superior=$(echo "$mi_all" | jq -r '.[] | select(.name == "Pozione di guarigione superiore") | .id')
          mi_superior=$(get "$api/api/magic-items/$superior?lang=2" | jq -c '{name, parentName, rarity, heal: .mechanics.healDice, text: (.description | contains("Guarigione suprema"))}')
          healing=$(echo "$mi_all" | jq -r '.[] | select(.name == "Pozione di guarigione" and .parentId == null) | .id')
          mi_healing_en=$(get "$api/api/magic-items/$healing?lang=1" | jq -c '{name, variants: [.variants[].name]}')
          haversack=$(echo "$mi_all" | jq -r '.[] | select(.name == "Zainetto pratico") | .id')
          mi_alias=$(get "$api/api/magic-items/$haversack?lang=1" | jq -c '{name, alias}')
          mi_post=$(code -X POST $api/api/magic-items $json -H "Authorization: Bearer $A" -d '{}')
          # Homebrew: a private variant of the ring of protection (listed on its own and under the ring for its author only),
          # the editor model in both languages, the validation of the rules, the account count and the bin
          ring=$(echo "$mi_all" | jq -r '.[] | select(.name == "Anello di protezione") | .id')
          mi_ring_edit=$(get "$api/api/magic-items/$ring/edit")
          mi_edit_view=$(echo "$mi_ring_edit" | jq -c '{languages: [.translations[].language] | sort, type, rarity, effects: (.mechanics.effects | length)}')
          hb=$(echo "$mi_ring_edit" | jq -c --arg id "$ring" '.visibility = 2 | .variantOfId = $id | .rarity = 4 | .mechanics.effects = [{kind: 1, value: 2}, {kind: 4, value: 2}] | .translations = [.translations[] | if .language == 2 then .name = "Anello di protezione superiore" else .name = "Ring of Greater Protection" end | .alias = null]')
          mi_hb=$(curl -s -X POST "$api/api/magic-items?lang=2" $json -H "Authorization: Bearer $A" -d "$hb")
          mi_hb_id=$(echo "$mi_hb" | jq -r .id)
          mi_hb_view=$(get "$api/api/magic-items/$mi_hb_id?lang=2" -H "Authorization: Bearer $A" | jq -c '{name, parentName, rarity, base: .isOfficialSRD, canEdit, effects: [.mechanics.effects[] | [.kind, .value]], text: (.description | length > 0)}')
          mi_hb_list=$(get "$api/api/magic-items?ruleset=1&lang=2" -H "Authorization: Bearer $A" | jq -c --arg id "$mi_hb_id" '[.[] | select(.id == $id) | .parentId != null]')
          mi_hb_under=$(get "$api/api/magic-items/$ring?lang=1" -H "Authorization: Bearer $A" | jq -c '[.variants[].name]')
          mi_hb_anon=$(get "$api/api/magic-items/$ring?lang=1" | jq -c '[.variants[].name]')
          mi_hb_bob=$(code "$api/api/magic-items/$mi_hb_id?lang=2" -H "Authorization: Bearer $B")
          mi_hb_dice=$(code -X POST "$api/api/magic-items" $json -H "Authorization: Bearer $A" -d "$(echo "$hb" | jq -c '.mechanics.healDice = "tanti"')")
          mi_hb_effect=$(code -X POST "$api/api/magic-items" $json -H "Authorization: Bearer $A" -d "$(echo "$hb" | jq -c '.mechanics.effects = [{kind: 13, value: 0}]')")
          mi_hb_put=$(code -X PUT "$api/api/magic-items/$mi_hb_id" $json -H "Authorization: Bearer $A" -d "$(echo "$hb" | jq -c '.requiresAttunement = false')")
          mi_hb_after=$(get "$api/api/magic-items/$mi_hb_id?lang=1" -H "Authorization: Bearer $A" | jq -c '{name, attunement: .requiresAttunement}')
          mi_srd_put=$(code -X PUT "$api/api/magic-items/$ring" $json -H "Authorization: Bearer $A" -d "$hb")
          mi_bob_delete=$(code -X DELETE "$api/api/magic-items/$mi_hb_id" -H "Authorization: Bearer $B")
          mi_anon_post=$(code -X POST "$api/api/magic-items" $json -d "$hb")
          mi_acc=$(curl -sf $api/api/account/summary -H "Authorization: Bearer $A" | jq .homebrew.magicItems)
          mi_delete=$(code -X DELETE "$api/api/magic-items/$mi_hb_id" -H "Authorization: Bearer $A")
          mi_bin=$(curl -sf "$api/api/trash?lang=2" -H "Authorization: Bearer $A" | jq -c '[.[] | select(.kind == "magic-item") | .name]')
          mi_missing=$(code "$api/api/magic-items/00000000-0000-0000-0000-000000000001?lang=1")
          echo "::notice title=database::magic items 2014: $mi14 | types=$mi_types | rings EN=$mi_rings | names=$mi_names | ring=$mi_ring | superior=$mi_superior | healing EN=$mi_healing_en | alias=$mi_alias | POST=$mi_post | unknown=$mi_missing"
          echo "::notice title=database::magic items Homebrew: edit=$mi_edit_view | variant=$mi_hb_view list=$mi_hb_list under ring=$mi_hb_under anonymous=$mi_hb_anon bob=$mi_hb_bob | dice=$mi_hb_dice effect=$mi_hb_effect | PUT=$mi_hb_put after=$mi_hb_after | base PUT=$mi_srd_put bob DELETE=$mi_bob_delete anonymous POST=$mi_anon_post account=$mi_acc | DELETE=$mi_delete bin=$mi_bin"
          mifail=0
          micheck() { if [ "$2" != "$3" ]; then echo "::error title=magic items::$1: got '$2', expected '$3'"; mifail=1; fi; }
          micheck "2014 counts" "$mi14" '{"total":412,"items":276,"srd":366,"realmforge":46,"rules":145}'
          micheck "categories" "$mi_types" '{"1":20,"2":25,"3":22,"4":9,"5":2,"6":13,"7":14,"8":38,"9":133}'
          micheck "rings (filter)" "$mi_rings" "36"
          micheck "official names" "$mi_names" '["Anello di protezione","Armatura demoniaca","Guanti del potere orchesco","Lama nera"]'
          micheck "ring of protection" "$mi_ring" '{"rarity":3,"attunement":true,"effects":[[1,1],[4,1]]}'
          micheck "superior healing" "$mi_superior" '{"name":"Pozione di guarigione superiore","parentName":"Pozione di guarigione","rarity":3,"heal":"8d4+8","text":true}'
          micheck "healing variants EN" "$mi_healing_en" '{"name":"Potion of Healing","variants":["Potion of Healing","Potion of Greater Healing","Potion of Superior Healing","Potion of Supreme Healing"]}'
          micheck "DMG alias" "$mi_alias" '{"name":"Handy Haversack","alias":"Heward'"'"'s Handy Haversack"}'
          micheck "empty POST" "$mi_post" "400"
          micheck "editor model" "$mi_edit_view" '{"languages":[1,2],"type":3,"rarity":3,"effects":2}'
          micheck "homebrew variant" "$mi_hb_view" '{"name":"Anello di protezione superiore","parentName":"Anello di protezione","rarity":4,"base":false,"canEdit":true,"effects":[[1,2],[4,2]],"text":true}'
          micheck "listed on its own" "$mi_hb_list" '[true]'
          micheck "under the ring" "$mi_hb_under" '["Ring of Greater Protection"]'
          micheck "hidden to others" "$mi_hb_anon" '[]'
          micheck "private for others" "$mi_hb_bob" "404"
          micheck "invalid dice" "$mi_hb_dice" "400"
          micheck "incomplete effect" "$mi_hb_effect" "400"
          micheck "PUT" "$mi_hb_put" "204"
          micheck "after PUT" "$mi_hb_after" '{"name":"Ring of Greater Protection","attunement":false}'
          micheck "base PUT" "$mi_srd_put" "403"
          micheck "other DELETE" "$mi_bob_delete" "403"
          micheck "anonymous POST" "$mi_anon_post" "401"
          micheck "account" "$mi_acc" "1"
          micheck "DELETE" "$mi_delete" "204"
          micheck "bin" "$mi_bin" '["Anello di protezione superiore"]'

          micheck "unknown" "$mi_missing" "404"
          test "$mifail" = "0"

          # Monsters: 441 statblocks of 2014, 322 of the SRD 5.1 (lycanthropes and the vampire as one statblock, the swarm and
          # giant rat variants linked to their original) and 119 of the Monster Manual outside it, texts written for RealmForge, the statblock in both languages, filters; a Homebrew variant of the goblin
          # (private to its author, the original untouched) and the validation of the statblock
          mo_all=$(get "$api/api/monsters?ruleset=1&lang=2")
          mo14=$(echo "$mo_all" | jq -c '{total: length, srd: map(select(.source == 2)) | length, realmforge: map(select(.source == 1)) | length, variants: map(select(.variantOfId != null)) | length, dragons: map(select(.type == 8)) | length}')
          mo_cr=$(get "$api/api/monsters?ruleset=1&minCr=20&lang=1" | jq length)
          goblin=$(echo "$mo_all" | jq -r '.[] | select(.name == "Goblin") | .id')
          mo_goblin=$(get "$api/api/monsters/$goblin?lang=2" | jq -c '{name: .text.name, ac: .armorClass, hp: .hitPoints, xp, cr: .challengeRating, armor: .text.armorClass, speed: .text.speed}')
          mo_goblin_en=$(get "$api/api/monsters/$goblin?lang=1" | jq -c '{name: .text.name, speed: .text.speed, nimble: (.text.traits | contains("Nimble Escape"))}')
          variant=$(get "$api/api/monsters/$goblin?lang=2" | jq -c --arg id "$goblin" '{ruleset, visibility: 2, size, type, armorClass: 16, hitPoints, hitDice, speed, abilities, challengeRating, xp, proficiencyBonus, passivePerception, variantOfId: $id, translations: [.text | .name = "Goblin furtivo" | .alias = null]}')
          mo_variant=$(curl -s -X POST "$api/api/monsters?lang=2" $json -H "Authorization: Bearer $A" -d "$variant")
          mo_variant_id=$(echo "$mo_variant" | jq -r .id)
          mo_variant_view=$(echo "$mo_variant" | jq -c '{name: .text.name, ac: .armorClass, variantOf: (.variantOfId != null), base: .isOfficialSRD, canEdit}')
          mo_variant_detail=$(get "$api/api/monsters/$mo_variant_id?lang=2" -H "Authorization: Bearer $A" | jq -c '{variantOfName, author: .authorName}')
          mo_variant_bob=$(code "$api/api/monsters/$mo_variant_id?lang=2" -H "Authorization: Bearer $B")
          mo_goblin_after=$(get "$api/api/monsters/$goblin?lang=2" | jq -c '{ac: .armorClass, name: .text.name}')
          mo_bad=$(code -X POST "$api/api/monsters" $json -H "Authorization: Bearer $A" -d "$(echo "$variant" | jq -c '.abilities = [10,10,10]')")
          mo_bad_cr=$(code -X POST "$api/api/monsters" $json -H "Authorization: Bearer $A" -d "$(echo "$variant" | jq -c '.challengeRating = 0.3')")
          mo_srd_put=$(code -X PUT "$api/api/monsters/$goblin" $json -H "Authorization: Bearer $A" -d "$variant")
          mo_bob_delete=$(code -X DELETE "$api/api/monsters/$mo_variant_id" -H "Authorization: Bearer $B")
          mo_anon_post=$(code -X POST "$api/api/monsters" $json -d "$variant")
          mo_acc=$(curl -sf $api/api/account/summary -H "Authorization: Bearer $A" | jq .homebrew.monsters)
          mo_delete=$(code -X DELETE "$api/api/monsters/$mo_variant_id" -H "Authorization: Bearer $A")
          echo "::notice title=database::monsters 2014: $mo14 | CR 20+=$mo_cr | goblin=$mo_goblin EN=$mo_goblin_en | variant=$mo_variant_view detail=$mo_variant_detail bob=$mo_variant_bob original=$mo_goblin_after | invalid=$mo_bad cr=$mo_bad_cr | base PUT=$mo_srd_put bob DELETE=$mo_bob_delete anonymous POST=$mo_anon_post account=$mo_acc | DELETE=$mo_delete"
          mofail=0
          mocheck() { if [ "$2" != "$3" ]; then echo "::error title=monsters::$1: got '$2', expected '$3'"; mofail=1; fi; }
          mocheck "2014 counts" "$mo14" '{"total":441,"srd":322,"realmforge":119,"variants":13,"dragons":46}'
          mocheck "challenge filter" "$mo_cr" "17"
          mocheck "goblin" "$mo_goblin" '{"name":"Goblin","ac":15,"hp":7,"xp":50,"cr":0.25,"armor":"15 (armatura di cuoio, scudo)","speed":"9 m"}'
          mocheck "goblin EN" "$mo_goblin_en" '{"name":"Goblin","speed":"30 ft.","nimble":true}'
          mocheck "variant" "$mo_variant_view" '{"name":"Goblin furtivo","ac":16,"variantOf":true,"base":false,"canEdit":true}'
          mocheck "variant detail" "$mo_variant_detail" '{"variantOfName":"Goblin","author":"Alice"}'
          mocheck "private variant for others" "$mo_variant_bob" "404"
          mocheck "original untouched" "$mo_goblin_after" '{"ac":15,"name":"Goblin"}'
          mocheck "three abilities" "$mo_bad" "400"
          mocheck "unknown challenge" "$mo_bad_cr" "400"
          mocheck "base PUT" "$mo_srd_put" "403"
          mocheck "other DELETE" "$mo_bob_delete" "403"
          mocheck "anonymous POST" "$mo_anon_post" "401"
          mocheck "account" "$mo_acc" "1"
          mocheck "DELETE" "$mo_delete" "204"
          test "$mofail" = "0"

          # Rules glossary: 88 entries of 2014 (SRD 5.1) and 155 of 2024 (SRD 5.2.1), Prone 2024 in Italian with the forms
          # linked in the other modules, the "See also" of Grappling, read only (no POST) and 404 for an unknown entry
          gl14=$(get "$api/api/rules?ruleset=1&lang=2" | jq -c '{total: length, srd: map(select(.source == 2)) | length, conditions: map(select(.category == 2)) | length, actions: map(select(.category == 3)) | length}')
          gl24_all=$(get "$api/api/rules?ruleset=2&lang=2")
          gl24=$(echo "$gl24_all" | jq -c '{total: length, srd: map(select(.source == 3)) | length, conditions: map(select(.category == 2)) | length, actions: map(select(.category == 3)) | length, linked: map(select(.aliases | length > 0)) | length}')
          prone_it=$(echo "$gl24_all" | jq -c '.[] | select(.key == "prone") | {name, category, aliases}')
          grappling=$(echo "$gl24_all" | jq -r '.[] | select(.key == "grappling") | .id')
          grappling_en=$(get "$api/api/rules/$grappling?lang=1" | jq -c '{name, related: [.related[].key]}')
          gl_post=$(code -X POST $api/api/rules $json -H "Authorization: Bearer $A" -d '{}')
          gl_missing=$(code "$api/api/rules/00000000-0000-0000-0000-000000000001?lang=1")
          echo "::notice title=database::glossary 2014: $gl14 | 2024: $gl24 | prone IT=$prone_it | grappling EN=$grappling_en | POST=$gl_post | unknown=$gl_missing"

          glfail=0
          glcheck() { if [ "$2" != "$3" ]; then echo "::error title=glossary::$1: got '$2', expected '$3'"; glfail=1; fi; }
          glcheck "2014 counts" "$gl14" '{"total":88,"srd":88,"conditions":15,"actions":10}'
          glcheck "2024 counts" "$gl24" '{"total":155,"srd":155,"conditions":15,"actions":12,"linked":74}'
          glcheck "prone IT" "$prone_it" '{"name":"Prono","category":2,"aliases":["prono","prona","proni","prone"]}'
          glcheck "grappling EN" "$grappling_en" '{"name":"Grappling","related":["unarmed-strike","grappled"]}'
          glcheck "POST" "$gl_post" "405"
          glcheck "unknown entry" "$gl_missing" "404"
          test "$glfail" = "0"

          # Characters: a 2024 dwarf sage wizard of level 1 from the base content (standard array, +2 Int +1 Con from the
          # background, Magic Initiate of the wizard list, kit A), checked by the shared rules engine and computed by the API;
          # then a level in fighter (multiclass), the sheet state, owner-only access and the refused choices
          ctx=$(get "$api/api/characters/context?ruleset=2&lang=1")
          ctx_counts=$(echo "$ctx" | jq -c '{classes: (.classes | length), species: (.species | length), backgrounds: (.backgrounds | length), feats: (.feats | length), spells: (.spells | length), items: (.items | length), wizardKits: ([.classes[] | select(.key == "wizard") | .equipment.kits[].letter] | join(",")), sageKeys: ([.backgrounds[] | select(.key == "sage") | .originFeatId != null] | .[0])}')
          ctx_spell_keys=$(echo "$ctx" | jq -c '{keyed: (([.spells[] | select(.key != null)] | length) == (.spells | length)), bless: ([.spells[] | select(.key == "bless")] | length)}')
          ctx_it=$(get "$api/api/characters/context?ruleset=1&lang=2" | jq -r '[.classes[] | select(.key == "fighter") | .equipment.rows[] | [.options[].letter] | join("")] | join(" ")')
          wizard=$(echo "$ctx" | jq -r '.classes[] | select(.key == "wizard") | .id')
          fighter=$(echo "$ctx" | jq -r '.classes[] | select(.key == "fighter") | .id')
          barbarian=$(echo "$ctx" | jq -r '.classes[] | select(.key == "barbarian") | .id')
          sage=$(echo "$ctx" | jq -r '.backgrounds[] | select(.key == "sage") | .id')
          dwarf=$(echo "$ctx" | jq -r '.species[] | select(.key == "dwarf") | .id')
          skills=$(echo "$ctx" | jq -c --arg s "$sage" --arg w "$wizard" '([.backgrounds[] | select(.id == $s) | .skills[]]) as $taken | [.classes[] | select(.id == $w) | .skillOptions[] | select(. as $x | $taken | index($x) | not)] | .[0:2]')
          cantrips=$(echo "$ctx" | jq -c '[.spells[] | select(.level == 0 and (.classes | index(8))) | .id]')
          firsts=$(echo "$ctx" | jq -c '[.spells[] | select(.level == 1 and (.classes | index(8))) | .id]')
          seconds=$(echo "$ctx" | jq -c '[.spells[] | select(.level == 2 and (.classes | index(8))) | .id]')
          style=$(echo "$ctx" | jq -r '[.feats[] | select(.category == 3)][0].id')
          masteries=$(echo "$ctx" | jq -c '[.items[] | select(.mastery != null and .weaponCategory == 2)] | .[0:3] | map(.id)')
          hero=$(jq -nc --arg w "$wizard" --arg s "$sage" --arg d "$dwarf" --argjson sk "$skills" --argjson c "$cantrips" --argjson f "$firsts" \
            '{name:"Elminster di prova", ruleset:2, speciesId:$d, backgroundId:$s, language:2,
              build:{alignment:2, size:3, abilityMethod:1, baseScores:[8,14,13,15,12,10], bonusMode:1, bonusChoices:[4,3],
                originFeat:{spellList:8, spellcastingAbility:4, cantrips:$c[3:5], spells:$f[4:5]},
                languages:["draconic","elvish"],
                classes:[{classId:$w, skills:$sk, cantrips:$c[0:3], spells:$f[0:4]}],
                levels:[{classId:$w}],
                backgroundEquipment:"A", classEquipment:["A"]}}')
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST $api/api/characters $json -H "Authorization: Bearer $A" -d "$1"; }
          ch_anon=$(code "$api/api/characters")
          ch_created=$(curl -s -X POST $api/api/characters $json -H "Authorization: Bearer $A" -d "$hero")
          ch_id=$(echo "$ch_created" | jq -r .id)
          if [ "$ch_id" = "null" ] || [ -z "$ch_id" ]; then echo "::error title=characters::create refused: $(echo "$ch_created" | head -c 600)"; fi
          ch_vitals=$(echo "$ch_created" | jq -c '{hp: .maxHitPoints, ac: .armorClass, items: (.sheet.inventory | length > 3), gold: .sheet.coins.gp, worn: ([.sheet.inventory[] | select(.equipped)] | length)}')
          ch_list=$(get "$api/api/characters?lang=2" -H "Authorization: Bearer $A" | jq -c '[.[] | {level, classLine, hp: .currentHitPoints}]')
          ch_bob_list=$(get "$api/api/characters" -H "Authorization: Bearer $B" | jq length)
          ch_bob=$(code "$api/api/characters/$ch_id" -H "Authorization: Bearer $B")
          ch_bad_scores=$(post "$(echo "$hero" | jq '.build.baseScores = [15,15,13,12,10,8]')")
          ch_bad_bonus=$(post "$(echo "$hero" | jq '.build.bonusMode = 3 | .build.bonusChoices = []')")
          ch_bad_cantrips=$(post "$(echo "$hero" | jq --argjson c "$cantrips" '.build.classes[0].cantrips = $c[0:4]')")
          ch_bad_level2=$(post "$(echo "$hero" | jq --argjson x "$seconds" '.build.classes[0].spells = (.build.classes[0].spells[0:3] + $x[0:1])')")
          ch_bad_skills=$(post "$(echo "$hero" | jq '.build.classes[0].skills = [3,3]')")
          ch_bad_kit=$(post "$(echo "$hero" | jq '.build.classEquipment = ["C"]')")
          ch_bad_language=$(post "$(echo "$hero" | jq '.build.languages = ["druidic","elvish","giant"]')")
          ch_bad_multiclass=$(post "$(echo "$hero" | jq --arg b "$barbarian" '.build.levels += [{classId:$b}]')")
          # Level up into fighter: Dexterity 14 and Intelligence 17 meet both prerequisites; Fighting Style feat and 3 masteries
          levelup=$(echo "$hero" | jq --arg f "$fighter" --arg st "$style" --argjson m "$masteries" \
            '.build.levels += [{classId:$f, hitPointRoll:7}] | .build.classes += [{classId:$f, fightingStyleFeatId:$st, weaponMasteries:$m}]')
          ch_levelup=$(curl -s -X PUT "$api/api/characters/$ch_id" $json -H "Authorization: Bearer $A" -d "$levelup")
          ch_level2=$(echo "$ch_levelup" | jq -c '{hp: .maxHitPoints, levels: (.build.levels | length), items: (.sheet.inventory | length > 3)}')
          if [ "$ch_level2" = '{"hp":null,"levels":null,"items":false}' ]; then echo "::error title=characters::level up refused: $(echo "$ch_levelup" | head -c 600)"; fi
          sheet=$(echo "$ch_levelup" | jq -c '.sheet | .currentHitPoints = 5 | .conditions = ["prone"] | .coins.gp = 99 | .spentSlots = [1] | .notes = "Test"')
          ch_sheet=$(curl -s -X PUT "$api/api/characters/$ch_id/sheet" $json -H "Authorization: Bearer $A" -d "$sheet" | jq -c '{hp: .maxHitPoints, ac: .armorClass}')
          ch_saved=$(get "$api/api/characters/$ch_id" -H "Authorization: Bearer $A" | jq -c '{hp: .sheet.currentHitPoints, conditions: .sheet.conditions, gp: .sheet.coins.gp, notes: .sheet.notes}')
          ch_bob_sheet=$(code -X PUT "$api/api/characters/$ch_id/sheet" $json -H "Authorization: Bearer $B" -d "$sheet")
          ch_edition=$(code -X PUT "$api/api/characters/$ch_id" $json -H "Authorization: Bearer $A" -d "$(echo "$levelup" | jq '.ruleset = 1')")
          ch_list2=$(get "$api/api/characters?lang=2" -H "Authorization: Bearer $A" | jq -c '[.[] | {level, classLine, hp: .currentHitPoints}]')
          # Sharing the character with bob (the game master): read-only sheet, owner's compendium, no writes, until he leaves
          sh_add=$(curl -s -X POST "$api/api/characters/$ch_id/shares" $json -H "Authorization: Bearer $A" -d '{"email":"bob@example.com"}' | jq -r .email)
          sh_unknown=$(code -X POST "$api/api/characters/$ch_id/shares" $json -H "Authorization: Bearer $A" -d '{"email":"nobody@example.com"}')
          sh_get=$(get "$api/api/characters/$ch_id" -H "Authorization: Bearer $B" | jq -c '{readOnly, name}')
          sh_owner_get=$(get "$api/api/characters/$ch_id" -H "Authorization: Bearer $A" | jq -c '.readOnly')
          sh_list=$(get "$api/api/characters/shared?lang=2" -H "Authorization: Bearer $B" | jq -c '[.[] | {name: .character.name, owner: .ownerName}]')
          sh_ctx=$(code "$api/api/characters/context?ruleset=2&lang=2&character=$ch_id" -H "Authorization: Bearer $B")
          sh_sheet=$(code -X PUT "$api/api/characters/$ch_id/sheet" $json -H "Authorization: Bearer $B" -d "$sheet")
          sh_people=$(get "$api/api/characters/$ch_id/shares" -H "Authorization: Bearer $A" | jq -r '[.[].email] | join(",")')
          sh_leave=$(code -X DELETE "$api/api/characters/$ch_id/shares/me" -H "Authorization: Bearer $B")
          sh_after=$(code "$api/api/characters/$ch_id" -H "Authorization: Bearer $B")
          echo "::notice title=characters::sharing: add=$sh_add unknown=$sh_unknown | bob GET=$sh_get owner readOnly=$sh_owner_get | bob shared=$sh_list | context=$sh_ctx | bob sheet PUT=$sh_sheet | people=$sh_people | leave=$sh_leave then GET=$sh_after"
          # Campaigns: bob is the master, alice joins as a player and brings her character; bob edits it (the change is
