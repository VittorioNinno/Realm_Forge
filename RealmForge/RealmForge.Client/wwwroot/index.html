<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealmForge</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- RealmForge emblem (new file names, so browsers do not keep the cached Blazor icon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link href="RealmForge.Client.styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" /></svg></span>
    </div>
    <script>
        // Small helpers called from .NET (LanguageStateService, CrossTabService)
        window.realmForge = {
            setDocumentLanguage: (lang) => { document.documentElement.lang = lang; },

            // Messages between the RealmForge tabs open in the same browser (e.g. "e-mail confirmed")
            tabs: (() => {
                const channel = 'BroadcastChannel' in window ? new BroadcastChannel('realmforge') : null;
                let listener = null;
                let pongs = 0;

                // Coming back to this tab (also from another browser profile or window): let .NET refresh stale states
                // (visibilitychange covers switching tabs, focus covers switching between windows side by side)
                const backToTab = () => { if (document.visibilityState === 'visible' && listener) { listener.invokeMethodAsync('OnTabMessage', 'tab-visible'); } };
                document.addEventListener('visibilitychange', backToTab);
                window.addEventListener('focus', backToTab);

                if (channel) {
                    channel.onmessage = (e) => {
                        const type = e.data && e.data.type;
                        if (type === 'ping') { channel.postMessage({ type: 'pong' }); }
                        else if (type === 'pong') { pongs++; }
                        else if (type && listener) { listener.invokeMethodAsync('OnTabMessage', type); }
                    };
                }

                return {
                    listen: (dotnetRef) => { listener = dotnetRef; },
                    announce: (type) => { if (channel) { channel.postMessage({ type }); } },
                    // True when at least one other RealmForge tab answers within 400 ms
                    hasOtherTabs: () => new Promise((resolve) => {
                        if (!channel) { resolve(false); return; }
                        pongs = 0;
                        channel.postMessage({ type: 'ping' });
                        setTimeout(() => resolve(pongs > 0), 400);
                    }),
                    // Browsers allow it only for tabs opened by a link with no history (like a link in an e-mail)
                    tryClose: () => { window.close(); }
                };
            })()
        };
    </script>
    <script>
        // Tooltip of the rules terms linked in the descriptions (a.rf-term, see GlossaryLinker): one floating box for the page,
        // filled with textContent only. Hover or keyboard focus shows it; a click follows the link to the glossary
        (() => {
            let tip = null;
            const termOf = (target) => (target && target.closest) ? target.closest('a.rf-term') : null;

            const show = (el) => {
                if (!tip) {
                    tip = document.createElement('div');
                    tip.className = 'rf-term-tip';
                    tip.setAttribute('role', 'tooltip');
                    document.body.appendChild(tip);
                }
                const head = document.createElement('div');
                head.className = 'rf-term-tip-head';
                const name = document.createElement('strong');
                name.textContent = el.dataset.termName || el.textContent;
                head.appendChild(name);
                if (el.dataset.termLabel) {
                    const label = document.createElement('span');
                    label.className = 'rf-term-tip-label';
                    label.textContent = el.dataset.termLabel;
                    head.appendChild(label);
                }
                const body = document.createElement('div');
                body.textContent = el.dataset.termTip || '';
                tip.replaceChildren(head, body);
                tip.classList.add('visible');

                // Above the term when there is room, otherwise below; always inside the window
                const r = el.getBoundingClientRect();
                const t = tip.getBoundingClientRect();
                const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
                const top = r.top - t.height - 8 >= 8 ? r.top - t.height - 8 : r.bottom + 8;
                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            };
            const hide = () => { if (tip) { tip.classList.remove('visible'); } };

            document.addEventListener('mouseover', (e) => { const el = termOf(e.target); if (el) { show(el); } });
            document.addEventListener('mouseout', (e) => { const el = termOf(e.target); if (el && !el.contains(e.relatedTarget)) { hide(); } });
            document.addEventListener('focusin', (e) => { const el = termOf(e.target); if (el) { show(el); } else { hide(); } });
            document.addEventListener('click', hide);
            window.addEventListener('scroll', hide, true);
        })();
    </script>
    <script>
        // Download of a file generated by the client (the character PDF): bytes in base64, saved with its name
        window.rfDownloadFile = (name, mime, base64) => {
            const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
            const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        };
    </script>
    <script>
        // Portrait crop: the size of a picture, and the square chosen in the crop dialog saved as a JPEG
        // (x, y: position of the square in % like background-position; zoom: 1 = the short side fills the square)
        window.rfImageSize = (src) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve([img.naturalWidth, img.naturalHeight]);
            img.onerror = () => resolve([0, 0]);
            img.src = src;
        });
        // The virtual tabletop: where an element is on screen, and a map picture scaled down to max px on its longer side
        window.rfRect = (el) => {
            const r = el.getBoundingClientRect();
            return [r.left, r.top, r.width, r.height];
        };
        window.rfResizeImage = (src, max) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                const width = Math.max(1, Math.round(img.naturalWidth * scale));
                const height = Math.max(1, Math.round(img.naturalHeight * scale));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                resolve({ url: canvas.toDataURL('image/jpeg', 0.82), width, height });
            };
            img.onerror = () => resolve({ url: '', width: 0, height: 0 });
            img.src = src;
        });
        // The virtual tabletop board: dragging tokens (moved by the browser, the cell chosen by the app on release),
        // panning the view, the ruler. The board ([data-board]) is in map pixels, scaled by its data-zoom
        window.rfVtt = (() => {
            const boards = new WeakMap();
            const S3 = Math.sqrt(3);
            const cell = (t, g) => t === 1 ? [g, 2 * g / S3] : t === 2 ? [2 * g / S3, g] : [g, g];
            const center = (t, g, ox, oy, c, r) => {
                const [w, h] = cell(t, g);
                if (t === 1) return [ox + w / 2 + c * w + (r & 1 ? w / 2 : 0), oy + h / 2 + r * 0.75 * h];
                if (t === 2) return [ox + w / 2 + c * 0.75 * w, oy + h / 2 + r * h + (c & 1 ? h / 2 : 0)];
                return [ox + (c + 0.5) * g, oy + (r + 0.5) * g];
            };
            const nearest = (t, g, ox, oy, x, y) => {
                if (t === 0) return [Math.floor((x - ox) / g), Math.floor((y - oy) / g)];
                const [w, h] = cell(t, g);
                const gc = Math.round(t === 1 ? (x - ox - w / 2) / w : (x - ox - w / 2) / (0.75 * w));
                const gr = Math.round(t === 1 ? (y - oy - h / 2) / (0.75 * h) : (y - oy - h / 2) / h);
                let best = [gc, gr], bd = Infinity;
                for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
                    const [cx, cy] = center(t, g, ox, oy, gc + dc, gr + dr);
                    const d = (cx - x) ** 2 + (cy - y) ** 2;
                    if (d < bd) { bd = d; best = [gc + dc, gr + dr]; }
                }
                return best;
            };
            const axial = (t, c, r) => t === 1 ? [c - (r - (r & 1)) / 2, r] : [c, r - (c - (c & 1)) / 2];
            const distance = (t, a, b) => {
                if (t === 0) return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]));
                const [q1, r1] = axial(t, a[0], a[1]), [q2, r2] = axial(t, b[0], b[1]);
                const dq = q1 - q2, dr = r1 - r2;
                return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
            };

            function attach(stage, dotnet, options) {
                detach(stage);
                const st = { dotnet, options, tool: 'select', drag: null, pan: null, ruler: null };
                const board = () => stage.querySelector('[data-board]');
                const zoom = () => parseFloat(board()?.dataset.zoom || '1');
                const toMap = (e) => {
                    const r = board().getBoundingClientRect(), z = zoom();
                    return [(e.clientX - r.left) / z, (e.clientY - r.top) / z];
                };
                const grid = () => {
                    const d = board().dataset;
                    return [parseInt(d.gridType, 10), parseFloat(d.grid), parseFloat(d.ox), parseFloat(d.oy)];
                };
                const drawRuler = () => {
                    const svg = board()?.querySelector('[data-ruler]');
                    if (!svg) return;
                    if (!st.ruler) { svg.innerHTML = ''; return; }
                    const [t, g, ox, oy] = grid();
                    const a = nearest(t, g, ox, oy, st.ruler.from[0], st.ruler.from[1]);
                    const b = nearest(t, g, ox, oy, st.ruler.to[0], st.ruler.to[1]);
                    const [x1, y1] = center(t, g, ox, oy, a[0], a[1]);
                    const [x2, y2] = center(t, g, ox, oy, b[0], b[1]);
                    const cells = distance(t, a, b);
                    const z = zoom();
                    const label = `${cells} · ${(cells * st.options.perCell).toLocaleString(st.options.locale)} ${st.options.unit}`;
                    const fs = 14 / z, pad = 8 / z;
                    svg.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff8c00" stroke-width="${3 / z}" stroke-dasharray="${8 / z} ${6 / z}" stroke-linecap="round"/>`
                        + `<circle cx="${x1}" cy="${y1}" r="${5 / z}" fill="#ff8c00"/><circle cx="${x2}" cy="${y2}" r="${5 / z}" fill="#ff8c00"/>`
                        + `<g transform="translate(${x2 + pad * 2} ${y2 - pad * 2})"><rect x="0" y="${-fs - pad}" width="${(label.length * 0.62 * fs) + pad * 2}" height="${fs + pad * 2}" rx="${4 / z}" fill="rgba(10,10,10,.85)" stroke="#ff8c00" stroke-width="${1 / z}"/>`
                        + `<text x="${pad}" y="0" font-size="${fs}" font-weight="700" fill="#ffffff" data-test="map-ruler-label">${label}</text></g>`;
                };
                st.down = (e) => {
                    if (e.button !== 0 || !board()) return;
                    const token = e.target.closest('[data-token]');
                    if (st.tool === 'ruler') {
                        const p = toMap(e);
                        st.ruler = { from: p, to: p, active: true };
                        drawRuler();
                        e.preventDefault();
                        return;
                    }
                    if (st.tool === 'select' && token) {
                        e.preventDefault();
                        st.drag = { el: token, id: token.dataset.token, x: e.clientX, y: e.clientY, moved: false, movable: token.dataset.movable === '1' };
                        if (st.drag.movable) dotnet.invokeMethodAsync('TokenGrabbed');
                        return;
                    }
                    if (e.target.closest('[data-board]') || e.target === stage) {
                        st.pan = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop, moved: false };
                        stage.classList.add('panning');
                    }
                };
                st.move = (e) => {
                    if (st.drag) {
                        const z = zoom(), dx = (e.clientX - st.drag.x) / z, dy = (e.clientY - st.drag.y) / z;
                        if (!st.drag.moved && Math.hypot(e.clientX - st.drag.x, e.clientY - st.drag.y) < 4) return;
                        st.drag.moved = true;
                        if (st.drag.movable) {
                            st.drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
                            st.drag.el.classList.add('dragging');
                        }
                    } else if (st.pan) {
                        st.pan.moved = true;
                        stage.scrollLeft = st.pan.left - (e.clientX - st.pan.x);
                        stage.scrollTop = st.pan.top - (e.clientY - st.pan.y);
                    } else if (st.ruler?.active) {
                        st.ruler.to = toMap(e);
                        drawRuler();
                    }
                };
                st.up = async (e) => {
                    if (st.drag) {
                        const d = st.drag;
                        st.drag = null;
                        if (!d.moved) {
                            await dotnet.invokeMethodAsync('TokenClicked', d.id);
                            return;
                        }
                        if (!d.movable) return;
                        const z = zoom();
                        const cx = parseFloat(d.el.dataset.cx) + (e.clientX - d.x) / z;
                        const cy = parseFloat(d.el.dataset.cy) + (e.clientY - d.y) / z;
                        try {
                            await dotnet.invokeMethodAsync('TokenDropped', d.id, cx, cy);
                        } finally {
                            d.el.style.transform = '';
                            d.el.classList.remove('dragging');
                        }
                    } else if (st.pan) {
                        const moved = st.pan.moved;
                        st.pan = null;
                        stage.classList.remove('panning');
                        if (!moved && st.tool === 'select') dotnet.invokeMethodAsync('BoardClicked');
                    } else if (st.ruler?.active) {
                        st.ruler.active = false;
                    }
                };
                st.wheel = (e) => {
                    if (!st.options.wheelZoom && !e.ctrlKey) return;
                    e.preventDefault();
                    dotnet.invokeMethodAsync('Wheel', e.deltaY < 0 ? 1 : -1);
                };
                stage.addEventListener('pointerdown', st.down);
                window.addEventListener('pointermove', st.move);
                window.addEventListener('pointerup', st.up);
                stage.addEventListener('wheel', st.wheel, { passive: false });
                st.drawRuler = drawRuler;
                boards.set(stage, st);
            }

            function detach(stage) {
                const st = stage && boards.get(stage);
                if (!st) return;
                stage.removeEventListener('pointerdown', st.down);
                window.removeEventListener('pointermove', st.move);
                window.removeEventListener('pointerup', st.up);
                stage.removeEventListener('wheel', st.wheel);
                boards.delete(stage);
            }

            function tool(stage, name) {
                const st = boards.get(stage);
                if (!st) return;
                st.tool = name;
                if (name !== 'ruler') st.ruler = null;
                st.drawRuler();
            }

            // The zoom that fits the whole map in the stage
            function fit(stage, width, height) {
                const r = stage.getBoundingClientRect();
                return Math.min((r.width - 16) / width, (r.height - 16) / height);
            }

            function fullscreen(el) {
                if (document.fullscreenElement) return document.exitFullscreen();
                return el.requestFullscreen?.();
            }

            return { attach, detach, tool, fit, fullscreen };
        })();
        window.rfCropImage = (src, x, y, zoom, size) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
                const sx = (img.naturalWidth - side) * x / 100;
                const sy = (img.naturalHeight - side) * y / 100;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => resolve('');
            img.src = src;
        });
    </script>
    <script>
        // Passkeys (WebAuthn): the API sends the options as JSON with base64url buffers, the browser answers with the
        // credential as JSON. Older browsers without parse...FromJSON / toJSON get the conversion by hand.
        window.rfPasskeys = (() => {
            const toBuffer = (s) => {
                const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
                const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
                return Uint8Array.from(bin, (c) => c.charCodeAt(0)).buffer;
            };
            const toBase64Url = (buffer) => {
                let bin = '';
                for (const b of new Uint8Array(buffer)) bin += String.fromCharCode(b);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };
            const creation = (o) => PublicKeyCredential.parseCreationOptionsFromJSON
                ? PublicKeyCredential.parseCreationOptionsFromJSON(o)
                : { ...o, challenge: toBuffer(o.challenge), user: { ...o.user, id: toBuffer(o.user.id) },
                    excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: toBuffer(c.id) })) };
            const request = (o) => PublicKeyCredential.parseRequestOptionsFromJSON
                ? PublicKeyCredential.parseRequestOptionsFromJSON(o)
                : { ...o, challenge: toBuffer(o.challenge), allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: toBuffer(c.id) })) };
            const asJson = (credential) => {
                if (typeof credential.toJSON === 'function') return JSON.stringify(credential.toJSON());
                const r = credential.response;
                const json = { id: credential.id, rawId: toBase64Url(credential.rawId), type: credential.type,
                    authenticatorAttachment: credential.authenticatorAttachment ?? null,
                    clientExtensionResults: credential.getClientExtensionResults(), response: { clientDataJSON: toBase64Url(r.clientDataJSON) } };
                if (r.attestationObject) {
                    json.response.attestationObject = toBase64Url(r.attestationObject);
                    json.response.transports = typeof r.getTransports === 'function' ? r.getTransports() : [];
                } else {
                    json.response.authenticatorData = toBase64Url(r.authenticatorData);
                    json.response.signature = toBase64Url(r.signature);
                    json.response.userHandle = r.userHandle ? toBase64Url(r.userHandle) : null;
                }
                return JSON.stringify(json);
            };
            const run = async (call) => {
                try {
                    const credential = await call();
                    return credential ? { ok: true, credential: asJson(credential) } : { ok: false, error: 'NotAllowedError' };
                } catch (e) {
                    return { ok: false, error: e && e.name ? e.name : 'Error' };
                }
            };
            return {
                supported: () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext),
                create: (options) => run(() => navigator.credentials.create({ publicKey: creation(JSON.parse(options)) })),
                get: (options) => run(() => navigator.credentials.get({ publicKey: request(JSON.parse(options)) }))
            };
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
