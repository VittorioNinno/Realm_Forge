<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealmForge</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- RealmForge emblem (new file names, so browsers do not keep the cached Blazor icon) -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link href="RealmForge.Client.styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" /></svg></span>
    </div>
    <script>
        // Small helpers called from .NET (LanguageStateService, CrossTabService)
        window.realmForge = {
            setDocumentLanguage: (lang) => { document.documentElement.lang = lang; },

            // Messages between the RealmForge tabs open in the same browser (e.g. "e-mail confirmed")
            tabs: (() => {
                const channel = 'BroadcastChannel' in window ? new BroadcastChannel('realmforge') : null;
                let listener = null;
                let pongs = 0;

                // Coming back to this tab (also from another browser profile or window): let .NET refresh stale states
                // (visibilitychange covers switching tabs, focus covers switching between windows side by side)
                const backToTab = () => { if (document.visibilityState === 'visible' && listener) { listener.invokeMethodAsync('OnTabMessage', 'tab-visible'); } };
                document.addEventListener('visibilitychange', backToTab);
                window.addEventListener('focus', backToTab);

                if (channel) {
                    channel.onmessage = (e) => {
                        const type = e.data && e.data.type;
                        if (type === 'ping') { channel.postMessage({ type: 'pong' }); }
                        else if (type === 'pong') { pongs++; }
                        else if (type && listener) { listener.invokeMethodAsync('OnTabMessage', type); }
                    };
                }

                return {
                    listen: (dotnetRef) => { listener = dotnetRef; },
                    announce: (type) => { if (channel) { channel.postMessage({ type }); } },
                    // True when at least one other RealmForge tab answers within 400 ms
                    hasOtherTabs: () => new Promise((resolve) => {
                        if (!channel) { resolve(false); return; }
                        pongs = 0;
                        channel.postMessage({ type: 'ping' });
                        setTimeout(() => resolve(pongs > 0), 400);
                    }),
                    // Browsers allow it only for tabs opened by a link with no history (like a link in an e-mail)
                    tryClose: () => { window.close(); }
                };
            })()
        };
    </script>
    <script>
        // Tooltip of the rules terms linked in the descriptions (a.rf-term, see GlossaryLinker): one floating box for the page,
        // filled with textContent only. Hover or keyboard focus shows it; a click follows the link to the glossary
        (() => {
            let tip = null;
            const termOf = (target) => (target && target.closest) ? target.closest('a.rf-term') : null;

            const show = (el) => {
                if (!tip) {
                    tip = document.createElement('div');
                    tip.className = 'rf-term-tip';
                    tip.setAttribute('role', 'tooltip');
                    document.body.appendChild(tip);
                }
                const head = document.createElement('div');
                head.className = 'rf-term-tip-head';
                const name = document.createElement('strong');
                name.textContent = el.dataset.termName || el.textContent;
                head.appendChild(name);
                if (el.dataset.termLabel) {
                    const label = document.createElement('span');
                    label.className = 'rf-term-tip-label';
                    label.textContent = el.dataset.termLabel;
                    head.appendChild(label);
                }
                const body = document.createElement('div');
                body.textContent = el.dataset.termTip || '';
                tip.replaceChildren(head, body);
                tip.classList.add('visible');

                // Above the term when there is room, otherwise below; always inside the window
                const r = el.getBoundingClientRect();
                const t = tip.getBoundingClientRect();
                const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
                const top = r.top - t.height - 8 >= 8 ? r.top - t.height - 8 : r.bottom + 8;
                tip.style.left = left + 'px';
                tip.style.top = top + 'px';
            };
            const hide = () => { if (tip) { tip.classList.remove('visible'); } };

            document.addEventListener('mouseover', (e) => { const el = termOf(e.target); if (el) { show(el); } });
            document.addEventListener('mouseout', (e) => { const el = termOf(e.target); if (el && !el.contains(e.relatedTarget)) { hide(); } });
            document.addEventListener('focusin', (e) => { const el = termOf(e.target); if (el) { show(el); } else { hide(); } });
            document.addEventListener('click', hide);
            window.addEventListener('scroll', hide, true);
        })();
    </script>
    <script>
        // Download of a file generated by the client (the character PDF): bytes in base64, saved with its name
        window.rfDownloadFile = (name, mime, base64) => {
            const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
            const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        };
    </script>
    <script>
        // Portrait crop: the size of a picture, and the square chosen in the crop dialog saved as a JPEG
        // (x, y: position of the square in % like background-position; zoom: 1 = the short side fills the square)
        window.rfImageSize = (src) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve([img.naturalWidth, img.naturalHeight]);
            img.onerror = () => resolve([0, 0]);
            img.src = src;
        });
        // The virtual tabletop: where an element is on screen, and a map picture scaled down to max px on its longer side
        window.rfRect = (el) => {
            const r = el.getBoundingClientRect();
            return [r.left, r.top, r.width, r.height];
        };
        window.rfResizeImage = (src, max) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
                const width = Math.max(1, Math.round(img.naturalWidth * scale));
                const height = Math.max(1, Math.round(img.naturalHeight * scale));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                resolve({ url: canvas.toDataURL('image/jpeg', 0.82), width, height });
            };
            img.onerror = () => resolve({ url: '', width: 0, height: 0 });
            img.src = src;
        });
        // The virtual tabletop board: dragging tokens (moved by the browser, the cell chosen by the app on release),
        // panning the view, the ruler. The board ([data-board]) is in map pixels, scaled by its data-zoom
        // Notices of a table opened by a master: the browser's own, only with the user's leave and when the tab is not in view
        window.rfLive = {
            permission: () => ('Notification' in window) ? Notification.permission : 'unsupported',
            ask: async () => ('Notification' in window) ? await Notification.requestPermission() : 'unsupported',
            notify: (title, body, url, tag) => {
                if (!('Notification' in window) || Notification.permission !== 'granted' || document.visibilityState === 'visible') return;
                try {
                    const n = new Notification(title, { body, tag, icon: 'img/icon-192.png' });
                    n.onclick = () => {
                        window.focus();
                        if (window.Blazor && Blazor.navigateTo) Blazor.navigateTo(url); else location.href = url;
                        n.close();
                    };
                } catch { /* some browsers only notify from a service worker */ }
            }
        };

        window.rfVtt = (() => {
            const boards = new WeakMap();
            const S3 = Math.sqrt(3);
            const cell = (t, g) => t === 1 ? [g, 2 * g / S3] : t === 2 ? [2 * g / S3, g] : [g, g];
            const center = (t, g, ox, oy, c, r) => {
                const [w, h] = cell(t, g);
                if (t === 1) return [ox + w / 2 + c * w + (r & 1 ? w / 2 : 0), oy + h / 2 + r * 0.75 * h];
                if (t === 2) return [ox + w / 2 + c * 0.75 * w, oy + h / 2 + r * h + (c & 1 ? h / 2 : 0)];
                return [ox + (c + 0.5) * g, oy + (r + 0.5) * g];
            };
            const nearest = (t, g, ox, oy, x, y) => {
                if (t === 0) return [Math.floor((x - ox) / g), Math.floor((y - oy) / g)];
                const [w, h] = cell(t, g);
                const gc = Math.round(t === 1 ? (x - ox - w / 2) / w : (x - ox - w / 2) / (0.75 * w));
                const gr = Math.round(t === 1 ? (y - oy - h / 2) / (0.75 * h) : (y - oy - h / 2) / h);
                let best = [gc, gr], bd = Infinity;
                for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) {
                    const [cx, cy] = center(t, g, ox, oy, gc + dc, gr + dr);
                    const d = (cx - x) ** 2 + (cy - y) ** 2;
                    if (d < bd) { bd = d; best = [gc + dc, gr + dr]; }
                }
                return best;
            };
            const axial = (t, c, r) => t === 1 ? [c - (r - (r & 1)) / 2, r] : [c, r - (c - (c & 1)) / 2];
            const distance = (t, a, b) => {
                if (t === 0) return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]));
                const [q1, r1] = axial(t, a[0], a[1]), [q2, r2] = axial(t, b[0], b[1]);
                const dq = q1 - q2, dr = r1 - r2;
                return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
            };

            // The areas of spells, as MapAreas in the app: the outline and the cells whose centre is inside
            const areaOutline = (kind, ox, oy, tx, ty, length, c) => {
                if (kind === 'sphere') return null;
                const d = Math.hypot(tx - ox, ty - oy);
                const [dx, dy] = d < 0.001 ? [1, 0] : [(tx - ox) / d, (ty - oy) / d];
                const [nx, ny] = [-dy, dx];
                const reach = length + c / 2;
                const half = kind === 'line' ? c / 2 : kind === 'cube' ? length / 2 : reach / 2;
                const [ex, ey] = [ox + dx * reach, oy + dy * reach];
                if (kind === 'cone') return [[ox, oy], [ex + nx * half, ey + ny * half], [ex - nx * half, ey - ny * half]];
                const [sx, sy] = [ox + dx * c / 2, oy + dy * c / 2];
                return [[sx + nx * half, sy + ny * half], [ex + nx * half, ey + ny * half], [ex - nx * half, ey - ny * half], [sx - nx * half, sy - ny * half]];
            };
            const segDist = (a, b, x, y) => {
                const vx = b[0] - a[0], vy = b[1] - a[1], l2 = vx * vx + vy * vy;
                const t = l2 < 1e-9 ? 0 : Math.max(0, Math.min(1, ((x - a[0]) * vx + (y - a[1]) * vy) / l2));
                return Math.hypot(a[0] + t * vx - x, a[1] + t * vy - y);
            };
            const inPolygon = (poly, x, y) => {
                for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) if (segDist(poly[j], poly[i], x, y) <= 0.5) return true;
                let inside = false;
                for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                    const [xi, yi] = poly[i], [xj, yj] = poly[j];
                    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
                }
                return inside;
            };
            const corners = (t, g, ox, oy, c, r) => {
                const [cx, cy] = center(t, g, ox, oy, c, r);
                if (t === 0) return [[cx - g / 2, cy - g / 2], [cx + g / 2, cy - g / 2], [cx + g / 2, cy + g / 2], [cx - g / 2, cy + g / 2]];
                const [w, h] = cell(t, g), rad = t === 1 ? h / 2 : w / 2, start = t === 1 ? -90 : 0;
                return [0, 1, 2, 3, 4, 5].map(i => [cx + rad * Math.cos((start + 60 * i) * Math.PI / 180), cy + rad * Math.sin((start + 60 * i) * Math.PI / 180)]);
            };
            const areaCells = (t, g, gx, gy, kind, ox, oy, tx, ty, size) => {
                const length = size * g, poly = areaOutline(kind, ox, oy, tx, ty, length, g);
                const xs = poly ? poly.map(p => p[0]) : [ox - length, ox + length], ys = poly ? poly.map(p => p[1]) : [oy - length, oy + length];
                const a = nearest(t, g, gx, gy, Math.min(...xs), Math.min(...ys)), b = nearest(t, g, gx, gy, Math.max(...xs), Math.max(...ys));
                const o = nearest(t, g, gx, gy, ox, oy), out = [];
                for (let c = Math.max(0, a[0] - 1); c <= b[0] + 1; c++) for (let r = Math.max(0, a[1] - 1); r <= b[1] + 1; r++) {
                    if (kind !== 'sphere' && c === o[0] && r === o[1]) continue;
                    const [x, y] = center(t, g, gx, gy, c, r);
                    if (x < 0 || y < 0) continue;
                    if (kind === 'sphere' ? (x - ox) ** 2 + (y - oy) ** 2 <= length * length + 0.01 : inPolygon(poly, x, y)) out.push([c, r]);
                }
                return out;
            };

            function attach(stage, dotnet, options) {
                detach(stage);
                const st = { dotnet, options, tool: 'select', drag: null, pan: null, ruler: null };
                const board = () => stage.querySelector('[data-board]');
                const zoom = () => parseFloat(board()?.dataset.zoom || '1');
                const toMap = (e) => {
                    const r = board().getBoundingClientRect(), z = zoom();
                    return [(e.clientX - r.left) / z, (e.clientY - r.top) / z];
                };
                const grid = () => {
                    const d = board().dataset;
                    return [parseInt(d.gridType, 10), parseFloat(d.grid), parseFloat(d.ox), parseFloat(d.oy)];
                };
                const drawRuler = () => {
                    const svg = board()?.querySelector('[data-ruler]');
                    if (!svg) return;
                    if (!st.ruler) { svg.innerHTML = ''; return; }
                    const [t, g, ox, oy] = grid();
                    const a = nearest(t, g, ox, oy, st.ruler.from[0], st.ruler.from[1]);
                    const b = nearest(t, g, ox, oy, st.ruler.to[0], st.ruler.to[1]);
                    const [x1, y1] = center(t, g, ox, oy, a[0], a[1]);
                    const [x2, y2] = center(t, g, ox, oy, b[0], b[1]);
                    const cells = distance(t, a, b);
                    const z = zoom();
                    const label = `${cells} · ${(cells * st.options.perCell).toLocaleString(st.options.locale)} ${st.options.unit}`;
                    const fs = 14 / z, pad = 8 / z;
                    svg.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff8c00" stroke-width="${3 / z}" stroke-dasharray="${8 / z} ${6 / z}" stroke-linecap="round"/>`
                        + `<circle cx="${x1}" cy="${y1}" r="${5 / z}" fill="#ff8c00"/><circle cx="${x2}" cy="${y2}" r="${5 / z}" fill="#ff8c00"/>`
                        + `<g transform="translate(${x2 + pad * 2} ${y2 - pad * 2})"><rect x="0" y="${-fs - pad}" width="${(label.length * 0.62 * fs) + pad * 2}" height="${fs + pad * 2}" rx="${4 / z}" fill="rgba(10,10,10,.85)" stroke="#ff8c00" stroke-width="${1 / z}"/>`
                        + `<text x="${pad}" y="0" font-size="${fs}" font-weight="700" fill="#ffffff" data-test="map-ruler-label">${label}</text></g>`;
                };
                const layer = () => board()?.querySelector('[data-ruler]');
                // A token being dragged: the cells it covers from where it was, against its speed (and what it already
                // moved in this turn)
                // The way of a player's token around the walls and the closed doors (as MapTerrain.FindPath in the app):
                // every step 1, 2 into difficult terrain, no diagonal between two blocked squares; null when there is none
                const neighbours = (t, c, r) => {
                    if (t === 0) { const out = []; for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 1; dr++) if (dc || dr) out.push([c + dc, r + dr]); return out; }
                    const [q, ar] = axial(t, c, r);
                    return [[1, 0], [-1, 0], [0, 1], [0, -1], [1, -1], [-1, 1]].map(([dq, dr]) => {
                        const nq = q + dq, nr = ar + dr;
                        return t === 1 ? [nq + (nr - (nr & 1)) / 2, nr] : [nq, nr + (nq - (nq & 1)) / 2];
                    });
                };
                const findPath = (t, from, to, size) => {
                    const ter = st.terrain;
                    const side = t === 0 ? Math.max(1, size) : 1;
                    const covers = (c, r, test) => { for (let i = 0; i < side; i++) for (let j = 0; j < side; j++) if (test((c + i) + ',' + (r + j))) return true; return false; };
                    const free = (c, r) => c >= 0 && r >= 0 && !covers(c, r, k => ter.walls.has(k) || ter.closed.has(k));
                    const step = (c, r) => covers(c, r, k => ter.difficult.has(k)) ? 2 : 1;
                    const key = (c, r) => c + ',' + r;
                    if (from[0] === to[0] && from[1] === to[1]) return { cost: 0, path: [] };
                    if (!free(to[0], to[1])) return null;
                    const best = new Map([[key(from[0], from[1]), 0]]), back = new Map(), open = [[0, from[0], from[1]]];
                    while (open.length) {
                        let bi = 0;
                        for (let i = 1; i < open.length; i++) if (open[i][0] < open[bi][0]) bi = i;
                        const [cost, c, r] = open.splice(bi, 1)[0];
                        if (cost > (best.get(key(c, r)) ?? Infinity)) continue;
                        if (c === to[0] && r === to[1]) {
                            const path = [];
                            for (let k = key(c, r); k !== key(from[0], from[1]); k = back.get(k)) path.unshift(k.split(',').map(Number));
                            return { cost, path };
                        }
                        for (const [nc, nr] of neighbours(t, c, r)) {
                            if (!free(nc, nr)) continue;
                            if (t === 0 && nc !== c && nr !== r && !free(nc, r) && !free(c, nr)) continue;
                            const total = cost + step(nc, nr);
                            if (total > 120 || total >= (best.get(key(nc, nr)) ?? Infinity)) continue;
                            best.set(key(nc, nr), total);
                            back.set(key(nc, nr), key(c, r));
                            open.push([total, nc, nr]);
                        }
                    }
                    return null;
                };
                const drawMove = (el, dx, dy) => {
                    const svg = layer();
                    if (!svg) return;
                    if (!el) { svg.innerHTML = ''; st.route = null; return; }
                    const [t, g, ox, oy] = grid(), z = zoom();
                    const x1 = parseFloat(el.dataset.cx), y1 = parseFloat(el.dataset.cy);
                    const a = nearest(t, g, ox, oy, x1, y1), b = nearest(t, g, ox, oy, x1 + dx, y1 + dy);
                    // The players' tokens follow the way around the walls (worked out once per cell under the pointer)
                    let way = null, blocked = false;
                    if (st.terrain && st.terrain.block) {
                        const k = `${el.dataset.token}:${b[0]},${b[1]}`;
                        if (!st.route || st.route.k !== k) {
                            const from = [parseInt(el.dataset.col, 10), parseInt(el.dataset.row, 10)];
                            const to = [from[0] + b[0] - a[0], from[1] + b[1] - a[1]];
                            st.route = { k, way: findPath(t, from, to, parseInt(el.dataset.size || '1', 10)), from, a };
                        }
                        way = st.route.way;
                        blocked = !way;
                    }
                    const cells = (way ? way.cost : distance(t, a, b)) + parseInt(el.dataset.moved || '0', 10);
                    const speed = parseInt(el.dataset.speed || '0', 10);
                    const per = st.options.perCell, fmt = (n) => (n * per).toLocaleString(st.options.locale);
                    const label = blocked ? (st.options.blockedText || '✕') : speed > 0 ? `${fmt(cells)} / ${fmt(speed)} ${st.options.unit}` : `${fmt(cells)} ${st.options.unit}`;
                    const over = blocked || (speed > 0 && cells > speed), color = over ? '#ef4444' : '#ff8c00';
                    const [cx2, cy2] = center(t, g, ox, oy, b[0], b[1]);
                    const fs = 14 / z, pad = 8 / z;
                    // The way drawn through the centres of its cells (shifted as the token's own corner is)
                    const shift = [x1 - center(t, g, ox, oy, a[0], a[1])[0], y1 - center(t, g, ox, oy, a[0], a[1])[1]];
                    const pts = way && way.path.length ? [[x1, y1], ...way.path.map(([c, r]) => {
                        const [px, py] = center(t, g, ox, oy, c - st.route.from[0] + a[0], r - st.route.from[1] + a[1]);
                        return [px + shift[0], py + shift[1]];
                    })] : null;
                    svg.innerHTML = (pts
                        ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="${3 / z}" stroke-dasharray="${8 / z} ${6 / z}" stroke-linejoin="round" data-test="map-move-path"/>`
                        : `<line x1="${x1}" y1="${y1}" x2="${cx2}" y2="${cy2}" stroke="${color}" stroke-width="${3 / z}" stroke-dasharray="${8 / z} ${6 / z}"/>`)
                        + `<g transform="translate(${x1 + dx + pad * 3} ${y1 + dy - pad * 3})"><rect x="0" y="${-fs - pad}" width="${label.length * 0.62 * fs + pad * 2}" height="${fs + pad * 2}" rx="${4 / z}" fill="rgba(10,10,10,.85)" stroke="${color}" stroke-width="${1 / z}"/>`
                        + `<text x="${pad}" y="0" font-size="${fs}" font-weight="700" fill="#ffffff" data-test="map-move-label">${label}</text></g>`;
                };
                // The fog and the terrain share the brush: cells painted one by one, or a box
                const brushing = () => st.tool === 'terrain' ? st.options.terrainShape !== 'rect' : st.options.fogShape === 'brush';
                // A box of whole cells (the terrain, and the fog in the map editor) rather than a free area
                const snapping = () => !brushing() && (st.tool === 'terrain' || (st.tool === 'fog' && st.options.fogCells));
                const terrainColors = { walkable: '#22c55e', wall: '#ef4444', difficult: '#f59e0b', door: '#38bdf8' };
                const drawFog = () => {
                    const svg = layer();
                    if (!svg) return;
                    if (!st.fog) { svg.innerHTML = ''; return; }
                    const z = zoom(), reveal = st.options.fogMode !== 'cover';

                st.observer.observe(stage);
                st.drawRuler = drawRuler;
                st.drawCast = drawCast;
                boards.set(stage, st);
            }

            // The walls, difficult cells and closed doors the players' tokens go around (null: they move straight)
            function terrain(stage, data) {
                const st = boards.get(stage);
                if (!st) return;
                st.route = null;
                st.terrain = data && data.block ? {
                    block: true,
                    walls: new Set(data.walls || []),
                    difficult: new Set(data.difficult || []),
                    closed: new Set(data.closed || [])
                } : null;
            }

            // The effect of a hit, a miss, the damage or the healing on a token: a flash, a small shake, a number rising
            function strike(stage, tokenId, kind, text) {
                const el = stage && stage.querySelector(`.rf-vtt-token[data-token="${tokenId}"]`);
                if (!el) return;
                const cls = `fx-${kind}`;
                el.classList.remove('fx-hit', 'fx-miss', 'fx-crit', 'fx-heal');
                void el.offsetWidth;
                el.classList.add(cls);
                setTimeout(() => el.classList.remove(cls), 900);
                if (text) {
                    const f = document.createElement('span');
                    f.className = `rf-fx-float ${kind}`;
                    f.textContent = text;
                    f.setAttribute('data-test', 'map-fx');
                    el.appendChild(f);
                    setTimeout(() => f.remove(), 1500);
                }
            }

            function reveal(selector) {
                const el = document.querySelector(selector);
                if (el) el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
            }

            function detach(stage) {
                const st = stage && boards.get(stage);
                if (!st) return;
                stage.removeEventListener('pointerdown', st.down);
                window.removeEventListener('pointermove', st.move);
                window.removeEventListener('pointerup', st.up);
                window.removeEventListener('pointercancel', st.cancel);
                stage.removeEventListener('wheel', st.wheel);
                document.removeEventListener('keydown', st.key);
                st.observer?.disconnect();
                boards.delete(stage);
            }

            function tool(stage, name, extra) {
                const st = boards.get(stage);
                if (!st) return;
                if (extra) Object.assign(st.options, extra);
                st.tool = name;
                st.stroke = null;
                st.area = null;
                st.fog = null;
                st.eraseBox = null;
                if (name !== 'ruler') st.ruler = null;
                st.box = null;
                st.drawRuler();
                if (name === 'cast' && st.options.cast) {
                    const g = parseFloat(stage.querySelector('[data-board]').dataset.grid);
                    st.drawCast([st.options.cast.x + g * (st.options.cast.casterSize + 1), st.options.cast.y]);
                } else if (name !== 'cast') {
                    st.options.cast = null;
                }
            }

            // The zoom that fits the whole map in the stage
            function fit(stage, width, height) {
                // The room left by the tools and the dock floating over the stage (its padding) does not count
                const r = stage.getBoundingClientRect(), cs = getComputedStyle(stage);
                const w = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
                const h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
                return Math.min((w - 16) / width, (h - 16) / height);
            }

            // Where the map starts in what the stage scrolls (at the table the map has room around it to be moved freely)
            function origin(stage) {
                const m = stage.querySelector('.rf-vtt-map');
                if (!m) return [0, 0];
                const a = m.getBoundingClientRect(), b = stage.getBoundingClientRect();
                return [a.left - b.left - stage.clientLeft + stage.scrollLeft, a.top - b.top - stage.clientTop + stage.scrollTop];
            }

            // The centre of what the stage shows, in pixels of the map; and the stage moved to show a point in its centre
            function view(stage) {
                const z = parseFloat(stage.querySelector('[data-board]')?.dataset.zoom || '1'), [ox, oy] = origin(stage);
                return [(stage.scrollLeft - ox + stage.clientWidth / 2) / z, (stage.scrollTop - oy + stage.clientHeight / 2) / z];
            }

            function centerOn(stage, x, y, instant) {
                const z = parseFloat(stage.querySelector('[data-board]')?.dataset.zoom || '1'), [ox, oy] = origin(stage);
                stage.scrollTo({ left: x * z + ox - stage.clientWidth / 2, top: y * z + oy - stage.clientHeight / 2, behavior: instant ? 'instant' : 'smooth' });
            }

            // A token's pop-up kept inside the visible part of the stage: to the left of the token when it does not fit on
            // its right, up when it would go under the bottom (the dock lives there), down when it starts above the top
            function keepVisible(stage) {
                const card = stage.querySelector('.rf-vtt-toolbar');
                if (!card) return;
                const z = parseFloat(stage.querySelector('[data-board]')?.dataset.zoom || '1');
                card.style.translate = '';
                const s = stage.getBoundingClientRect(), c = card.getBoundingClientRect();
                const pad = 8, bottomRoom = 72;
                let dx = 0, dy = 0;
                if (c.right > s.right - pad) {
                    const token = stage.querySelector(`[data-token="${card.dataset.tokenId || ''}"]`);
                    const t = token?.getBoundingClientRect();
                    // Flipped to the left of the token if there is room, else just pulled back in
                    dx = t && t.left - pad - c.width >= s.left + pad ? (t.left - pad - c.width) - c.left : (s.right - pad) - c.right;
                }
                if (c.left + dx < s.left + pad) dx = (s.left + pad) - c.left;
                if (c.bottom > s.bottom - bottomRoom) dy = (s.bottom - bottomRoom) - c.bottom;
                if (c.top + dy < s.top + pad) dy = (s.top + pad) - c.top;
                if (dx || dy) card.style.translate = `${dx / z}px ${dy / z}px`;
            }

            function fullscreen(el) {
                if (document.fullscreenElement) return document.exitFullscreen();
                return el.requestFullscreen?.();
            }

            return { attach, detach, tool, terrain, strike, reveal, fit, fullscreen, view, center: centerOn, keepVisible };
        })();
        window.rfCropImage = (src, x, y, zoom, size) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const side = Math.min(img.naturalWidth, img.naturalHeight) / zoom;
                const sx = (img.naturalWidth - side) * x / 100;
                const sy = (img.naturalHeight - side) * y / 100;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = () => resolve('');
            img.src = src;
        });
    </script>
    <script>
        // Passkeys (WebAuthn): the API sends the options as JSON with base64url buffers, the browser answers with the
        // credential as JSON. Older browsers without parse...FromJSON / toJSON get the conversion by hand.
        window.rfPasskeys = (() => {
            const toBuffer = (s) => {
                const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
                const bin = atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4));
                return Uint8Array.from(bin, (c) => c.charCodeAt(0)).buffer;
            };
            const toBase64Url = (buffer) => {
                let bin = '';
                for (const b of new Uint8Array(buffer)) bin += String.fromCharCode(b);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            };
            const creation = (o) => PublicKeyCredential.parseCreationOptionsFromJSON
                ? PublicKeyCredential.parseCreationOptionsFromJSON(o)
                : { ...o, challenge: toBuffer(o.challenge), user: { ...o.user, id: toBuffer(o.user.id) },
                    excludeCredentials: (o.excludeCredentials || []).map((c) => ({ ...c, id: toBuffer(c.id) })) };
            const request = (o) => PublicKeyCredential.parseRequestOptionsFromJSON
                ? PublicKeyCredential.parseRequestOptionsFromJSON(o)
                : { ...o, challenge: toBuffer(o.challenge), allowCredentials: (o.allowCredentials || []).map((c) => ({ ...c, id: toBuffer(c.id) })) };
            const asJson = (credential) => {
                if (typeof credential.toJSON === 'function') return JSON.stringify(credential.toJSON());
                const r = credential.response;
                const json = { id: credential.id, rawId: toBase64Url(credential.rawId), type: credential.type,
                    authenticatorAttachment: credential.authenticatorAttachment ?? null,
                    clientExtensionResults: credential.getClientExtensionResults(), response: { clientDataJSON: toBase64Url(r.clientDataJSON) } };
                if (r.attestationObject) {
                    json.response.attestationObject = toBase64Url(r.attestationObject);
                    json.response.transports = typeof r.getTransports === 'function' ? r.getTransports() : [];
                } else {
                    json.response.authenticatorData = toBase64Url(r.authenticatorData);
                    json.response.signature = toBase64Url(r.signature);
                    json.response.userHandle = r.userHandle ? toBase64Url(r.userHandle) : null;
                }
                return JSON.stringify(json);
            };
            const run = async (call) => {
                try {
                    const credential = await call();
                    return credential ? { ok: true, credential: asJson(credential) } : { ok: false, error: 'NotAllowedError' };
                } catch (e) {
                    return { ok: false, error: e && e.name ? e.name : 'Error' };
                }
            };
            return {
                supported: () => !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext),
                create: (options) => run(() => navigator.credentials.create({ publicKey: creation(JSON.parse(options)) })),
                get: (options) => run(() => navigator.credentials.get({ publicKey: request(JSON.parse(options)) }))
            };
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
